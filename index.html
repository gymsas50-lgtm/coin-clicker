<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-id" content="arena-coin-clicker"><title>Сервер новой игры</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#11151b;color:#edf2f7;font:16px/1.6 system-ui,Arial;padding:24px}main{width:min(100%,560px);padding:36px;border:1px solid #303945;border-radius:18px;background:#191f28}small{font-size:12px;letter-spacing:.14em;color:#9aacc1}h1{font-size:32px;line-height:1.2;margin:14px 0}p{color:#aebbc9;margin:12px 0}.status{color:#9ad5ad}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:9px}footer{border-top:1px solid #303945;margin-top:25px;padding-top:18px;color:#77889c;font-size:13px}</style></head>
<body><main><small>ОСНОВА НОВОЙ ИГРЫ</small><h1>Сервер готов</h1><p>Старая игра удалена. Здесь появится новая.</p><p class="status" id="status"><span class="dot"></span>Проверка подключения…</p><footer>Доступ по IP и автообновление сохранены.</footer></main>
<script>(()=>{'use strict';let version='__GAME_VERSION__',busy=false;const status=document.getElementById('status');try{for(const store of[localStorage,sessionStorage])for(const key of Object.keys(store))if(key.startsWith('arena-coin-clicker:'))store.removeItem(key);}catch{}async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error();const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))throw Error();status.innerHTML='<span class="dot"></span>Сервер доступен';status.style.color='#9ad5ad';if(/^[a-f0-9]{64}$/.test(version)&&version!==next){location.reload();return;}version=next;}catch{status.textContent='Нет связи с сервером';status.style.color='#e7ba83';}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}else status.textContent='Запусти сервер через START.bat';})();</script></body></html>

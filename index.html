<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-id" content="arena-coin-clicker"><title>Тихая поляна</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#8ba779;font-family:Arial,sans-serif;color:#f4f4e8}canvas{display:block;touch-action:none}header{position:fixed;top:22px;left:24px;background:#263e35e8;padding:17px 22px;border-radius:12px;box-shadow:0 5px 25px #213c3220;pointer-events:none}.tag{font-size:9px;letter-spacing:3px;color:#b6c8aa}h1{font-size:22px;font-weight:500;margin:7px 0 5px}p{font-size:11px;color:#c5d1be;margin:0;line-height:1.8}footer{position:fixed;bottom:20px;right:24px;background:#263e35db;padding:10px 14px;border-radius:9px;font-size:11px;letter-spacing:1px;pointer-events:none}#pad{display:none;position:fixed;bottom:25px;left:25px;grid-template-columns:repeat(3,48px);gap:5px}button{height:48px;background:#263e35c9;color:white;border:1px solid #fff4;border-radius:9px;font-size:20px;touch-action:none;user-select:none}@media(pointer:coarse){#pad{display:grid}header{top:12px;left:12px;padding:12px 16px}}</style></head><body><canvas></canvas><header><div class="tag">2D / TOP DOWN</div><h1>Тихая поляна</h1><p>WASD или стрелки — ходить<br>R — вернуться на поляну</p></header><footer>КООРДИНАТЫ <span id="coords">0 / 70</span></footer><div id="pad"><span></span><button data-key="KeyW">↑</button><span></span><button data-key="KeyA">←</button><button data-key="KeyS">↓</button><button data-key="KeyD">→</button></div><script>(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),keys=new Set(),player={x:0,y:70,r:12},camera={x:0,y:70},world={w:9600,h:7200},zoom=.65;let width=0,height=0,last=0,walk=0,facing=0;const trees=[],rocks=[];let seed=12345;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}for(let i=0;i<1800;i++){const x=rand()*9460-4730,y=rand()*7060-3530;if(Math.abs(x)<115||Math.abs(y)<80||Math.hypot(x,y-70)<180)continue;trees.push({x,y,r:25+rand()*15,tone:rand()});}for(let i=0;i<360;i++){const x=rand()*9360-4680,y=rand()*6960-3480;if(Math.abs(x)<130||Math.abs(y)<90)continue;rocks.push({x,y,r:14+rand()*10});}const spider={x:0,y:115,r:3,scale:.4,speed:125,angle:-Math.PI/2,gait:0},trail=[{x:0,y:70}];const obstacles=[...trees.map(t=>({x:t.x,y:t.y,r:15})),...rocks];function reset(){spider.x=0;spider.y=115;spider.angle=-Math.PI/2;spider.feet=null;spider.previousX=0;spider.previousY=115;spider.gait=0;spider.scale=.4;spider.speed=125;spider.r=3;trail.length=0;trail.push({x:0,y:70});player.x=0;player.y=70;camera.x=0;camera.y=70;}const codes=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight','KeyR'];addEventListener('keydown',e=>{if(codes.includes(e.code)){e.preventDefault();keys.add(e.code);if(e.code==='KeyR')reset();}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>{keys.clear();last=0;});document.querySelectorAll('[data-key]').forEach(button=>{const clear=()=>keys.delete(button.dataset.key);button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys.add(button.dataset.key);});for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,clear);});function resize(){width=innerWidth;height=innerHeight;const ratio=Math.min(devicePixelRatio||1,2);canvas.width=width*ratio;canvas.height=height*ratio;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(ratio,0,0,ratio,0,0);}addEventListener('resize',resize);resize();function update(dt){let x=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),y=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));const length=Math.hypot(x,y);if(length){x/=length;y/=length;player.x+=x*190*dt;player.y+=y*190*dt;facing=Math.atan2(y,x);walk+=dt*12;}for(let pass=0;pass<3;pass++)for(const o of obstacles){let dx=player.x-o.x,dy=player.y-o.y,d=Math.hypot(dx,dy),min=player.r+o.r;if(d<min){if(d<.0001){dx=1;dy=0;d=1;}player.x=o.x+dx/d*min;player.y=o.y+dy/d*min;}}player.x=Math.max(-4780,Math.min(4780,player.x));player.y=Math.max(-3580,Math.min(3580,player.y));updateSpider(dt);updateSpiderFeet(dt);camera.x+=(player.x-camera.x)*(1-Math.exp(-dt*9));camera.y+=(player.y-camera.y)*(1-Math.exp(-dt*9));document.getElementById('coords').textContent=Math.round(player.x)+' / '+Math.round(player.y);}function updateSpider(dt){spider.clock=(spider.clock||0)+dt;const tail=trail[trail.length-1];if(!tail||Math.hypot(player.x-tail.x,player.y-tail.y)>7)trail.push({x:player.x,y:player.y});if(trail.length>1200)trail.splice(0,trail.length-1200);const distanceToPlayer=Math.hypot(player.x-spider.x,player.y-spider.y);const distanceFactor=Math.max(0,distanceToPlayer-40)/220;const targetScale=Math.min(65,.4+Math.pow(distanceFactor,1.45)*1.4);spider.scale+=(targetScale-spider.scale)*(1-Math.exp(-dt*(targetScale>spider.scale?4:.3)));spider.r=Math.min(10,7.5*spider.scale);spider.speed=Math.max(85,145/(1+distanceFactor*.16));if(distanceToPlayer<32&&trail.length<9)return;function clearPath(point){const dx=point.x-spider.x,dy=point.y-spider.y,lengthSq=dx*dx+dy*dy;for(const o of obstacles){const t=Math.max(0,Math.min(1,((o.x-spider.x)*dx+(o.y-spider.y)*dy)/(lengthSq||1)));if(Math.hypot(spider.x+dx*t-o.x,spider.y+dy*t-o.y)<o.r+spider.r+.5)return false;}return true;}for(let i=trail.length-1;i>0;i--)if(clearPath(trail[i])){trail.splice(0,i);break;}let budget=spider.speed*dt;while(budget>0&&trail.length){const target=trail[0],dx=target.x-spider.x,dy=target.y-spider.y,distance=Math.hypot(dx,dy);if(distance<1){trail.shift();continue;}const move=Math.min(distance,budget);spider.x+=dx/distance*move;spider.y+=dy/distance*move;const heading=Math.atan2(dy,dx),delta=Math.atan2(Math.sin(heading-spider.angle),Math.cos(heading-spider.angle));spider.angle+=delta*Math.min(1,dt*14);spider.gait+=move*.23;budget-=move;if(distance<=move+.01)trail.shift();else break;}for(let pass=0;pass<2;pass++)for(const o of obstacles){const dx=spider.x-o.x,dy=spider.y-o.y,d=Math.hypot(dx,dy),minimum=spider.r+o.r;if(d<minimum&&d>.001){spider.x=o.x+dx/d*minimum;spider.y=o.y+dy/d*minimum;}}}function updateSpiderFeet(dt){const scale=spider.scale,c=Math.cos(spider.angle),s=Math.sin(spider.angle);if(!spider.feet){spider.feet=[];for(const side of [-1,1])for(let leg=0;leg<4;leg++){const x=(leg-1.5)*10,y=side*(26-Math.abs(leg-1.5)*2);spider.feet.push({side,leg,x:spider.x+(x*c-y*s)*scale,y:spider.y+(x*s+y*c)*scale,lift:0,progress:1,group:(leg+(side===1?1:0))%2});}}const moving=Math.hypot(spider.x-(spider.previousX??spider.x),spider.y-(spider.previousY??spider.y))>dt*2;spider.previousX=spider.x;spider.previousY=spider.y;let active=spider.feet.find(f=>f.progress<1)?.group;for(const foot of spider.feet){const x=(foot.leg-1.5)*10+(moving?6:0),y=foot.side*(26-Math.abs(foot.leg-1.5)*2),tx=spider.x+(x*c-y*s)*scale,ty=spider.y+(x*s+y*c)*scale;if(foot.progress>=1&&Math.hypot(foot.x-tx,foot.y-ty)>scale*8&&(active===undefined||active===foot.group)){active=foot.group;foot.fromX=foot.x;foot.fromY=foot.y;foot.toX=tx;foot.toY=ty;foot.progress=0;}if(foot.progress<1){foot.progress=Math.min(1,foot.progress+dt/Math.max(.028,Math.min(.18,scale*12/Math.max(30,spider.speed))));const blend=foot.progress*foot.progress*(3-2*foot.progress);foot.x=foot.fromX+(foot.toX-foot.fromX)*blend;foot.y=foot.fromY+(foot.toY-foot.fromY)*blend;foot.lift=Math.sin(foot.progress*Math.PI)*4;}else foot.lift=0;}}
function drawSpider(){const t=spider.clock||0,breath=Math.sin(t*1.45)*.045,twitch=Math.pow(Math.max(0,Math.sin(t*2.7)),28)*Math.sin(t*61),look=Math.atan2(player.y-spider.y,player.x-spider.x)-spider.angle,headAngle=Math.atan2(Math.sin(look),Math.cos(look))*.22;ellipse(spider.x+spider.scale*2,spider.y+spider.scale*4,spider.scale*25,spider.scale*17,'#10201e65');ctx.save();ctx.translate(spider.x,spider.y);ctx.rotate(spider.angle+twitch*.025);ctx.scale(spider.scale,spider.scale);ctx.lineCap='round';function stroke(points,color,w){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.stroke();}function cavity(x,y,r){const rim=ctx.createRadialGradient(x-r*.25,y-r*.35,r*.45,x,y,r*1.4);rim.addColorStop(0,'#40202a');rim.addColorStop(.55,'#613d3e');rim.addColorStop(.78,'#ba927c');rim.addColorStop(1,'#60453e');ellipse(x,y,r*1.4,r*1.26,rim);const inside=ctx.createRadialGradient(x+r*.24,y+r*.32,r*.08,x,y,r);inside.addColorStop(0,'#05070b');inside.addColorStop(.5,'#100d16');inside.addColorStop(.79,'#36202c');inside.addColorStop(1,'#855445');ellipse(x,y,r,r*.94,inside);ctx.strokeStyle='#d4b190';ctx.lineWidth=r*.15;ctx.beginPath();ctx.ellipse(x,y,r*1.14,r*1.04,0,.7,2.9);ctx.stroke();ctx.strokeStyle='#24121e';ctx.lineWidth=r*.22;ctx.beginPath();ctx.ellipse(x,y-r*.04,r*1.03,r*.94,0,3.3,5.8);ctx.stroke();} function fleshyLeg(ax,ay,bx,by,width,count){const dx=bx-ax,dy=by-ay,length=Math.hypot(dx,dy)||1,nx=-dy/length,ny=dx/length;stroke([[ax+.65,ay+.8],[bx+.65,by+.8]],'#120e1888',width+1);const shade=ctx.createLinearGradient(ax-nx*width/2,ay-ny*width/2,ax+nx*width/2,ay+ny*width/2);shade.addColorStop(0,'#241d24');shade.addColorStop(.27,'#9b7a62');shade.addColorStop(.48,'#705044');shade.addColorStop(.8,'#493039');shade.addColorStop(1,'#241c25');stroke([[ax,ay],[bx,by]],shade,width);for(let i=0;i<count;i++){const f=(i+1)/(count+1),offset=(i%2?.2:-.2)*width,x=ax+dx*f+nx*offset,y=ay+dy*f+ny*offset,r=width*(.13+(i%3)*.025);cavity(x,y,r);}stroke([[ax-nx*width*.29,ay-ny*width*.29],[bx-nx*width*.29,by-ny*width*.29]],'#c09c7560',.22);} for(const side of [-1,1])for(let leg=0;leg<4;leg++){const foot=spider.feet?.find(f=>f.side===side&&f.leg===leg),root=(leg-1.5)*3.4,c=Math.cos(spider.angle),sn=Math.sin(spider.angle),dx=foot?(foot.x-spider.x)/spider.scale:root*3,dy=foot?(foot.y-spider.y)/spider.scale:side*26,rawX=dx*c+dy*sn,rawY=-dx*sn+dy*c-(foot?.lift||0),rawD=Math.max(.001,Math.hypot(rawX-root,rawY-side*3)),limit=Math.min(1,33/rawD),fx=root+(rawX-root)*limit,fy=side*3+(rawY-side*3)*limit,hx=fx-root,hy=fy-side*3,d=Math.max(.001,Math.hypot(hx,hy)),reach=Math.max(2.1,Math.min(33,d)),along=(17*17-19*19+reach*reach)/(2*reach),bend=Math.sqrt(Math.max(0,17*17-along*along)),kx=root+hx/d*along-hy/d*bend*side,ky=side*3+hy/d*along+hx/d*bend*side;fleshyLeg(root,side*3,kx,ky,3.9,8);fleshyLeg(kx,ky,fx,fy,2.8,10);stroke([[fx,fy],[fx+1.3,fy+side*2.7]],'#211e23',.65);const joint=ctx.createRadialGradient(kx-.5,ky-.6,.1,kx,ky,2.1);joint.addColorStop(0,'#a07965');joint.addColorStop(.55,'#66383e');joint.addColorStop(1,'#281d28');ellipse(kx,ky,2.1,1.8,joint);for(let pore=0;pore<5;pore++){const angle=pore/5*Math.PI*2,x=kx+Math.cos(angle)*1.05,y=ky+Math.sin(angle)*.8;cavity(x,y,.28);}stroke([[kx,ky],[kx+(fx-kx)*.35,ky+(fy-ky)*.35]],'#721f2a',1.4);ellipse(fx,fy,1,.65,'#6a1924');for(let hair=0;hair<8;hair++){const fraction=hair/8,hx=kx+(fx-kx)*fraction,hy=ky+(fy-ky)*fraction,amount=(hair%2?1:-1)*(1.3+(hair%3)*.35);stroke([[hx,hy],[hx+amount,hy+side*1.4]],'#3b3030',.22);}}ctx.save();ctx.scale(1+breath,1-breath);const shell=ctx.createRadialGradient(-7,-2,1,-7,0,12);shell.addColorStop(0,'#82705a');shell.addColorStop(.55,'#544b3d');shell.addColorStop(1,'#292727');ellipse(-6,0,12,9,shell);for(let stain=0;stain<15;stain++){const x=-14+(stain*3.71)%17,y=Math.sin(stain*2.3)*5.8;ellipse(x,y,1.3+stain%3*.3,.7,'#651f2d');}for(let row=-5;row<=5;row++)for(let col=-6;col<=6;col++){const hx=-6+col*1.62+(row%2)*.81,hy=row*1.48;if(((hx+6)/10)**2+(hy/7.4)**2>.93)continue;const variation=(Math.sin(row*18.4+col*33.7)+1)/2,r=.4+variation*.25,opening=1+Math.sin(t*.85+row*.6+col*.3)*.055;cavity(hx,hy,r*opening);}for(let hair=0;hair<56;hair++){const angle=hair/56*Math.PI*2,hx=-6+Math.cos(angle)*11.5,hy=Math.sin(angle)*8.4,amount=1.1+(hair%4)*.27;stroke([[hx,hy],[hx+Math.cos(angle)*amount,hy+Math.sin(angle)*amount]],'#3c3030',.22);}for(let drip=0;drip<7;drip++){const x=-12+drip*2.8,y=3+Math.sin(drip*3)*2;stroke([[x,y],[x+.3,y+2.1],[x-.2,y+2.6]],'#8b2336',.48);ellipse(x-.2,y+2.6,.4,.6,'#9e3342');}ctx.restore();ctx.save();ctx.rotate(headAngle+twitch*.025);ellipse(4,0,6.3,5,'#302829');ellipse(4,-1.2,5.1,3,'#594337');for(const side of [-1,1]){const claw=Math.sin(t*1.7+side)*.9;stroke([[8,side*2.4],[11+claw,side*3.3],[13,side*1],[11.3,side*.4]],'#2b2027',2);stroke([[8,side*2.4],[11+claw,side*3.3]],'#86664d',.65);const palp=Math.sin(t*3.1+side)*.8;stroke([[6,side*4],[9+palp,side*6],[10,side*4.8]],'#4b3931',.9);}ctx.shadowColor='#ff1834';ctx.shadowBlur=10;for(const side of [-1,1]){ellipse(7.2,side*1.5,1.25,1.1,'#ed1534');ellipse(4.7,side*3.1,.73,.73,'#b6203d');ellipse(2.5,side*3.2,.48,.48,'#b6203d');ellipse(6,side*.45,.4,.4,'#ff3750');}ctx.shadowBlur=0;for(const side of [-1,1])ellipse(7.5,side*1.5-.3,.28,.25,'#ffd0c2');ctx.restore();ctx.restore();}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}function drawPlayer(){ellipse(player.x+3,player.y+7,13,8,'#183f343b');ellipse(player.x,player.y,player.r,player.r,'#447bce');ellipse(player.x-3,player.y-4,3,3,'#ffffff35');}function drawTree(t){ellipse(t.x+7,t.y+9,t.r+6,t.r*.72,'#203e322e');ctx.fillStyle='#74553e';ctx.fillRect(t.x-6,t.y-5,12,23);ellipse(t.x,t.y-9,t.r,t.r*.88,t.tone>.5?'#3c7256':'#447c58');ellipse(t.x-9,t.y-16,t.r*.64,t.r*.61,'#528864');ellipse(t.x+9,t.y-9,t.r*.57,t.r*.59,'#477b57');ellipse(t.x-9,t.y-21,t.r*.34,t.r*.28,'#659b70');}const grass=[];for(let i=0;i<22000;i++)grass.push({x:rand()*9600-4800,y:rand()*7200-3600,v:rand()});function draw(){ctx.fillStyle='#263f35';ctx.fillRect(0,0,width,height);ctx.save();ctx.translate(width/2,height/2);ctx.scale(zoom,zoom);ctx.translate(-camera.x,-camera.y);ctx.fillStyle='#8ba779';ctx.fillRect(-4800,-3600,9600,7200);ctx.fillStyle='#baa98a';ctx.fillRect(-4800,-35,9600,70);ctx.fillRect(-38,-3600,76,7200);ctx.fillStyle='#c7b797';ctx.fillRect(-4800,-25,9600,50);ctx.fillRect(-27,-3600,54,7200);ctx.strokeStyle='#749567';ctx.lineWidth=1;for(const g of grass){if(Math.abs(g.x)<45||Math.abs(g.y)<42||Math.abs(g.x-camera.x)>width/(2*zoom)+20||Math.abs(g.y-camera.y)>height/(2*zoom)+20)continue;ctx.beginPath();ctx.moveTo(g.x-2,g.y+3);ctx.lineTo(g.x,g.y-2);ctx.lineTo(g.x+2,g.y+3);ctx.stroke();}ctx.strokeStyle='#e4d4b25c';ctx.lineWidth=5;ctx.strokeRect(-4798,-3598,9596,7196);for(const r of rocks){if(Math.abs(r.x-camera.x)>width/(2*zoom)+40||Math.abs(r.y-camera.y)>height/(2*zoom)+40)continue;ellipse(r.x+4,r.y+6,r.r,r.r*.65,'#263c332e');ellipse(r.x,r.y,r.r,r.r*.77,'#7d8b85');ellipse(r.x-3,r.y-4,r.r*.75,r.r*.47,'#a9b0a0');}const ordered=[...trees,{y:spider.y+6,spider:true},{y:player.y+8,player:true}].sort((a,b)=>a.y-b.y);for(const object of ordered){if(object.player)drawPlayer();else if(object.spider)drawSpider();else if(Math.abs(object.x-camera.x)<width/(2*zoom)+80&&Math.abs(object.y-camera.y)<height/(2*zoom)+80)drawTree(object);}ctx.restore();}function frame(now){requestAnimationFrame(frame);const dt=last?Math.min(.04,(now-last)/1000):0;last=now;update(dt);draw();}window.topdownGame={player,spider,trail,camera,keys,update,reset,obstacles};requestAnimationFrame(frame);})();</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

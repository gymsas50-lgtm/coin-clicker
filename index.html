<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Платформер</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08142c;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}.hint{position:fixed;bottom:20px;left:24px;color:#91a9c4;font-size:12px;pointer-events:none}</style></head><body><canvas id="game" tabindex="0" aria-label="Платформер. A и D — движение, пробел — прыжок."></canvas><div class="hint">A / D — ходьба · ПРОБЕЛ — прыжок</div><script>(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),keys=new Set(),player={x:0,y:0,vx:0,vy:0,grounded:true,previousX:0,previousY:0};let w=0,h=0,last=0,accumulator=0,jumpBuffer=0,coyote=.08;const step=1/120;function resize(){const old=h;w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);if(!old)player.x=w*.35;player.y=player.grounded?h*.8-44:Math.min(player.y+(h-old)*.8,h*.8-44);player.x=Math.max(0,Math.min(w-28,player.x));player.previousX=player.x;player.previousY=player.y;}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{if(['KeyA','KeyD','ArrowLeft','ArrowRight','Space'].includes(e.code)){e.preventDefault();keys.add(e.code);if(e.code==='Space'&&!e.repeat)jumpBuffer=.12;}});addEventListener('keyup',e=>keys.delete(e.code));function resetInput(){keys.clear();jumpBuffer=0;player.vx=0;last=0;accumulator=0;}addEventListener('blur',resetInput);document.addEventListener('visibilitychange',resetInput);canvas.addEventListener('pointerdown',()=>canvas.focus());function simulate(dt){player.previousX=player.x;player.previousY=player.y;const dir=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),target=dir*280,rate=(dir?2100:2600)*dt;player.vx+=Math.sign(target-player.vx)*Math.min(rate,Math.abs(target-player.vx));player.x+=player.vx*dt;if(player.x<0){player.x=0;player.vx=0;}if(player.x>w-28){player.x=w-28;player.vx=0;}coyote=player.grounded?.08:Math.max(0,coyote-dt);if(jumpBuffer>0&&coyote>0){player.vy=-580;player.grounded=false;coyote=0;jumpBuffer=0;}jumpBuffer=Math.max(0,jumpBuffer-dt);player.y+=player.vy*dt+1800*dt*dt*.5;player.vy=Math.min(850,player.vy+1800*dt);const floor=h*.8-44;if(player.y>=floor&&player.vy>=0){player.y=floor;player.vy=0;player.grounded=true;}else player.grounded=false;}function frame(now){requestAnimationFrame(frame);if(document.hidden){last=0;return;}const dt=last?Math.min(.1,(now-last)/1000):0;last=now;accumulator+=dt;while(accumulator>=step){simulate(step);accumulator-=step;}const alpha=accumulator/step,x=player.previousX+(player.x-player.previousX)*alpha,y=player.previousY+(player.y-player.previousY)*alpha;const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#060e25');bg.addColorStop(1,'#18365d');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.fillStyle='#0b1930';ctx.fillRect(0,h*.8,w,h*.2);ctx.strokeStyle='#5e9fb9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,h*.8);ctx.lineTo(w,h*.8);ctx.stroke();ctx.fillStyle='#66cc65';ctx.fillRect(x,y,28,44);ctx.strokeStyle='#254b33';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,26,42);}window.platformerPlayer=player;requestAnimationFrame(frame);})();</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.a

<!doctype html>

<html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Яйцо</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101d2a}body{display:grid;place-items:center;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 48%,#527b7650 0%,transparent 46%),radial-gradient(ellipse at 12% 12%,#4a426b85,transparent 55%),radial-gradient(ellipse at 90% 88%,#22575890,transparent 55%),linear-gradient(155deg,#19243c,#101e29 55%,#142f32)}body:before{content:'';position:fixed;inset:-15%;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 30% 40%,#96dac41a,transparent 38%),radial-gradient(ellipse at 70% 60%,#b29edf1a,transparent 36%);filter:blur(25px);animation:drift 18s ease-in-out infinite alternate}body:after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,#daebdca6 0 1px,transparent 2px),radial-gradient(circle,#b7dccc70 0 1px,transparent 2px),radial-gradient(circle,#d4c9ed55 0 1px,transparent 2px);background-size:237px 193px,347px 283px,173px 317px;background-position:25px 31px,92px 131px,45px 92px;mask-image:radial-gradient(ellipse at center,transparent 12%,#000 75%);opacity:.65}@keyframes drift{from{transform:translate(-3%,-2%) rotate(-4deg)}to{transform:translate(3%,3%) rotate(4deg)}}@media(prefers-reduced-motion:reduce){body:before{animation:none}}button{width:210px;height:270px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;filter:drop-shadow(0 18px 26px #050e1855) drop-shadow(0 0 45px #deebba1c);transition:transform .12s}button:active{transform:scale(.92) rotate(-3deg)}button:focus-visible{outline:2px solid #b2a68a;outline-offset:12px;border-radius:50%}svg{width:100%;height:100%;overflow:visible}</style></head><body><button aria-label="Нажать на яйцо"><svg viewBox="0 0 210 270" aria-hidden="true"><defs><radialGradient id="shell" cx=".32" cy=".28" r=".8"><stop stop-color="#fffdf0"/><stop offset=".65" stop-color="#eee3c6"/><stop offset="1" stop-color="#cdbb95"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="5"/></filter></defs><ellipse cx="105" cy="249" rx="65" ry="9" fill="#877450" opacity=".14" filter="url(#blur)"/><path d="M105 18C71 18 22 100 22 163c0 49 34 79 83 79s83-30 83-79C188 100 139 18 105 18Z" fill="url(#shell)" stroke="#c6b693" stroke-width="2"/><path d="M80 51C61 70 45 103 42 126" fill="none" stroke="#fffef5" stroke-width="10" stroke-linecap="round" opacity=".65"/><g fill="#b7a17d" opacity=".27"><ellipse cx="128" cy="78" rx="3" ry="4" transform="rotate(-20 128 78)"/><ellipse cx="66" cy="151" rx="4" ry="3"/><ellipse cx="142" cy="173" rx="3" ry="5" transform="rotate(24 142 173)"/><ellipse cx="95" cy="206" rx="3" ry="2"/><circle cx="112" cy="126" r="2"/><circle cx="52" cy="186" r="2"/></g></svg></button><script>document.querySelector('button').addEventListener('click',e=>{const b=e.currentTarget;b.getAnimations().forEach(a=>a.cancel());b.animate([{transform:'scale(.92) rotate(-3deg)'},{transform:'scale(1.045) rotate(2deg)'},{transform:'scale(1) rotate(0)'}],{duration:260,easing:'ease-out'});});</script></body></html>

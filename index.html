<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#edf0f2"><title>Новая игра</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf0f2;font-family:Arial,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}.hint{position:fixed;top:calc(20px + env(safe-area-inset-top));left:20px;color:#65717b;font-size:13px;pointer-events:none}.hint strong{display:block;margin-bottom:6px;font-size:16px;color:#36434e}#stick{position:fixed;left:calc(25px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:132px;height:132px;border:1px solid #697e913b;border-radius:50%;background:#72899c12;touch-action:none;display:none}#knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:#5a758db3;border:2px solid #ffffffb0;pointer-events:none}body.touch #stick{display:block}@media(pointer:coarse){#stick{display:block}}.hint span{opacity:.85}</style></head><body><!-- Updater compatibility: simple-coin-clicker.v1 --><canvas id="game" aria-label="Двумерная игра, вид сверху. Управление WASD, стрелками или джойстиком."></canvas><div class="hint"><strong>Новая игра · вид сверху</strong><span id="help">WASD / стрелки — движение</span></div><div id="stick" role="group" aria-label="Джойстик движения"><div id="knob"></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),keys=new Set();const player={x:0,y:0,r:17,speed:225};let w=0,h=0,dpr=1,axisX=0,axisY=0,pointer=null,last=0;const world={width:2400,height:1800};function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}addEventListener('resize',resize);resize();const movement=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];addEventListener('keydown',e=>{if(movement.includes(e.code)){e.preventDefault();keys.add(e.code);}});addEventListener('keyup',e=>keys.delete(e.code));function resetStick(){pointer=null;axisX=axisY=0;knob.style.transform='translate(0px,0px)';}function reset(){keys.clear();resetStick();last=0;}addEventListener('blur',reset);document.addEventListener('visibilitychange',reset);function moveStick(e){if(e.pointerId!==pointer)return;const r=stick.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const len=Math.hypot(x,y),max=42;if(len>max){x=x/len*max;y=y/len*max;}axisX=x/max;axisY=y/max;if(Math.hypot(axisX,axisY)<.1)axisX=axisY=0;knob.style.transform=`translate(${x}px,${y}px)`;}stick.addEventListener('pointerdown',e=>{if(pointer!==null)return;e.preventDefault();pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e);});stick.addEventListener('pointermove',moveStick);for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{if(e.pointerId===pointer)resetStick();});function touchMode(){document.body.classList.add('touch');document.querySelector('#help').textContent='Джойстик слева — движение';}if(navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches)touchMode();addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchMode();},{passive:true});function frame(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;if(!document.hidden){let x=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+axisX,y=(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0)+axisY;const len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}player.x=Math.max(-world.width/2+player.r,Math.min(world.width/2-player.r,player.x+x*player.speed*dt));player.y=Math.max(-world.height/2+player.r,Math.min(world.height/2-player.r,player.y+y*player.speed*dt));draw();}requestAnimationFrame(frame);}function draw(){ctx.fillStyle='#edf0f2';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-player.x,h/2-player.y);ctx.fillStyle='#f9fafb';ctx.fillRect(-1200,-900,2400,1800);ctx.strokeStyle='#e8edf0';ctx.lineWidth=1;const left=Math.max(-1200,Math.floor((player.x-w/2)/60)*60),right=Math.min(1200,player.x+w/2),top=Math.max(-900,Math.floor((player.y-h/2)/60)*60),bottom=Math.min(900,player.y+h/2);ctx.beginPath();for(let x=left;x<=right;x+=60){ctx.moveTo(x,-900);ctx.lineTo(x,900);}for(let y=top;y<=bottom;y+=60){ctx.moveTo(-1200,y);ctx.lineTo(1200,y);}ctx.stroke();ctx.strokeStyle='#bac7d1';ctx.lineWidth=4;ctx.strokeRect(-1200,-900,2400,1800);ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fillStyle='#557fa0';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore();}window.addEventListener('pagehide',reset);requestAnimationFrame(frame);})();
</script></body></html>

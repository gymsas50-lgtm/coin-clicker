<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-id" content="arena-coin-clicker"><title></title><style>html,body{margin:0;width:100%;height:100%;background:#fff}</style></head><body><script>(()=>{'use strict';const version='__GAME_VERSION__';let pending=false;async function check(){if(pending||!/^https?:$/.test(location.protocol)||version.startsWith('__'))return;pending=true;try{const response=await fetch('/version',{cache:'no-store',signal:AbortSignal.timeout(2500)});if(!response.ok)return;const next=(await response.text()).trim();if(/^[a-f0-9]{64}$/.test(next)&&next!==version)location.reload();}catch{}finally{pending=false;}}setInterval(check,1000);addEventListener('focus',check);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});})();</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пустая страница</title><style>html,body{margin:0;width:100%;height:100%;background:#fff}</style></head><body><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

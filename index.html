<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Полёт</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060e25;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}.hint{position:fixed;left:28px;bottom:22px;color:#91a9c4;font-size:12px;letter-spacing:.5px;pointer-events:none}</style></head><body><canvas id="flight" tabindex="0" aria-label="Кубик. Пробел или клик — прыжок."></canvas><div class="hint">ПРОБЕЛ / КЛИК — ПРЫЖОК</div><script>(()=>{'use strict';const canvas=document.getElementById('flight'),ctx=canvas.getContext('2d');let w=0,h=0,last=0,time=0,distance=0,keyboard=false,pointer=false;const ship={y:0,vy:0,angle:0,grounded:false},trail=[],sparks=[];let seed=12;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}const stars=Array.from({length:110},()=>({x:random(),y:random(),depth:.2+random()*.8,size:.7+random()*1.6}));function resize(){const oldH=h;w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);ship.y=Math.min(oldH?ship.y*h/oldH:h*.78-16,h*.78-16);trail.length=0;}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump();keyboard=true;}});addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))keyboard=false;});canvas.addEventListener('pointerdown',e=>{jump();pointer=true;canvas.focus();canvas.setPointerCapture(e.pointerId);});for(const event of['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>pointer=false);function jump(){if(ship.grounded){ship.vy=-560;ship.grounded=false;}}function releas

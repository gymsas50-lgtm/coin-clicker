<script>(()=>{const field=document.querySelector('.slime-field'),pets=new Set();let held=null,inspected=null,lastFrame=performance.now();const info=document.createElement('div');info.className='slime-info';info.hidden=true;info.setAttribute('role','dialog');info.setAttribute('aria-label','Информация о слайме');document.body.append(info);function closeInfo(){if(inspected){inspected.paused=false;inspected.wait=performance.now()+900;}inspected=null;info.hidden=true;}function positionInfo(){if(!inspected)return;const r=inspected.el.getBoundingClientRect();info.style.left=Math.max(10,Math.min(innerWidth-210,r.right+12))+'px';info.style.top=Math.max(10,Math.min(innerHeight-info.offsetHeight-10,r.top-35))+'px';}function inspect(p){if(inspected===p){closeInfo();return;}closeInfo();inspected=p;p.paused=true;p.hop=null;p.throwing=false;p.el.querySelector('svg').getAnimations().forEach(a=>a.cancel());p.el.querySelector('svg').style.transform='none';info.innerHTML='<div class="info-title">Зелёный слайм <span class="info-close" role="button" tabindex="0" aria-label="Закрыть">×</span></div><div class="info-number">Житель №'+p.number+'</div><div class="info-line"><span>Уровень</span><strong>I</strong></div><div class="info-line"><span>Вид</span><strong>Луговой</strong></div><div class="info-line"><span>Редкость</span><strong>Обычный</strong></div><div class="info-status">● Отдыхает, пока открыта карточка</div>';info.hidden=false;positionInfo();info.querySelector('.info-close').onclick=closeInfo;info.querySelector('.info-close').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();closeInfo();}};}document.addEventListener('pointerdown',e=>{if(!info.contains(e.target)&&!e.target.closest('.slime'))closeInfo();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeInfo();});const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function bound(x,y){const w=Math.max(0,field.clientWidth-48),h=Math.max(0,field.clientHeight-58);x=clamp(x,0,w);y=clamp(y,10,h+10);const cx=w }else if(now>p.wait&&!reduce.matches){const a=Math.random()*Math.PI*2,d=20+Math.random()*55,q=bound(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d);p.hop={x:p.x,y:p.y,tx:q.x,ty:q.y,start:now,duration:440+Math.random()*180};}}positionInfo();requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('resize',()=>pets.forEach(p=>{p.hop=null;place(p);}));})();</script>

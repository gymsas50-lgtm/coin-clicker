<html lang="ru"><head><meta charset="UTF-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#edf0f2"><title>Новая игра</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf0f2;font-family:Arial,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}.hint{position:fixed;top:calc(20px + env(safe-area-inset-top));left:20px;color:#65717b;font-size:13px;pointer-events:none}.hint strong{display:block;margin-bottom:6px;font-size:16px;color:#36434e}#stick{position:fixed;left:calc(25px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:132px;height:132px;border:1px solid #697e913b;border-radius:50%;background:#72899c12;touch-action:none;display:none}#knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:#5a758db3;border:2px solid #ffffffb0;pointer-events:none}body.touch #stick{display:block}@media(pointer:coarse){#stick{display:block}}.hint span{opacity:.85}#gameScreen{position:fixed;inset:0;overflow:hidden;width:100%;height:100%}body.rotated #gameScreen{inset:auto;left:50%;top:50%;width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}body.rotated .hint{top:16px;left:20px}body.rotated #stick{left:25px;bottom:22px;width:116px;height:116px}body.rotated #knob{left:33px;top:33px}.update-banner{position:absolute;z-index:100;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);padding:13px 23px;border:1px solid #adc7bb;border-radius:13px;background:#f5fffa;color:#345c48;box-shadow:0 5px 22px #29453420;text-align:center;pointer-events:none;animation:updateBanner 4s ease both}.update-banner strong{display:block;font-size:15px}.update-banner span{display:block;margin-top:5px;font-size:12px;color:#668373}@keyframes updateBanner{0%{opacity:0;translate:0 -18px}12%,78%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -12px}}@media(prefers-reduced-motion:reduce){.update-banner{animation-name:updateBannerQuiet}@keyframes updateBannerQuiet{0%,100%{opacity:0}12%,78%{opacity:1}}}</style></head><body><!-- Updater compatibility: simple-coin-clicker.v1 --><div id="gameScreen"><canvas id="game" aria-label="Двумерная игра, вид сверху. Управление WASD, стрелками или джойстиком."></canvas><div class="hint"><strong>Новая игра · вид сверху</strong><div id="networkStatus" style="margin:6px 0;color:#687b89">Подключение…</div><span id="help">WASD / стрелки — движение</span></div><div id="stick" role="group" aria-label="Джойстик движения"><div id="knob"></div></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),keys=new Set();const player={x:0,y:0,r:17,speed:225};let rotated=false,w=0,h=0,dpr=1,axisX=0,axisY=0,pointer=null,last=0;let session=null,seq=0,networkBusy=false,inputX=0,inputY=0,others=[],online=false,nextJoin=0;const netStatus=document.querySelector('#networkStatus');async function request(url,data){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),3500);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal});if(!r.ok){if(r.status===401)session=null;throw Error('Connection');}return await r.json();}finally{clearTimeout(timeout);}}function applyState(list,joining=false){if(!Array.isArray(list))return;const me=list.find(p=>p.id===session?.id);if(me){if(joining||Math.hypot(me.x-player.x,me.y-player.y)>100){player.x=me.x;player.y=me.y;}player.color=me.color;}const old=new Map(others.map(p=>[p.id,p])),received=performance.now();others=list.filter(p=>p.id!==session?.id).map(p=>{const history=old.get(p.id)?.history||[];history.push({t:received,x:p.x,y:p.y});while(history.length>12)history.shift();return {...p,history};});online=true;netStatus.textContent='В сети: '+list.length+' · ты — кружок с точкой';}async function networkStep(){if(networkBusy||Date.now()<nextJoin)return;networkBusy=true;try{if(!session){const d=await request('/join',{});session={id:d.id,token:d.token};applyState(d.players,true);}else{const d=await request('/input',{...session,seq:++seq,x:inputX,y:inputY});applyState(d.players);if(d.version)checkVersion(d.version);}}catch(e){online=false;others=[];netStatus.textContent='Нет связи · повторное подключение…';nextJoin=Date.now()+1800;}finally{networkBusy=false;}}function showUpdateBanner(){if(document.querySelector('.update-banner'))return;const banner=document.createElement('div');banner.className='update-banner';banner.setAttribute('role','status');const title=document.createElement('strong');title.textContent='Вышло обновление';const detail=document.createElement('span');detail.textContent='Сейчас загрузим новую версию';banner.append(title,detail);document.querySelector('#gameScreen').append(banner);setTimeout(()=>banner.remove(),4050);}
let gameVersion='__GAME_VERSION__',updatePending=false;if(!/^[a-f0-9]{64}$/.test(gameVersion))gameVersion=null;function checkVersion(v){if(!gameVersion){gameVersion=v;return;}if(v!==gameVersion&&!updatePending){updatePending=true;showUpdateBanner();setTimeout(()=>location.reload(),4100);}}let versionChecking=false;async function pollVersion(){if(versionChecking||document.hidden)return;versionChecking=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(r.ok){const v=(await r.text()).trim();if(/^[a-f0-9]{64}$/.test(v))checkVersion(v);}}catch(e){}finally{versionChecking=false;}}pollVersion();setInterval(pollVersion,2000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollVersion();});setInterval(networkStep,50);setTimeout(networkStep,0);
const mapObjects=[{"type":"pond","x":420,"y":-330,"w":270,"h":170},{"type":"bench","x":-160,"y":-190,"w":100,"h":32},{"type":"bench","x":190,"y":180,"w":100,"h":32},{"type":"tree","x":-350,"y":-260,"r":38},{"type":"tree","x":-470,"y":-190,"r":34},{"type":"tree","x":-420,"y":-380,"r":40},{"type":"tree","x":240,"y":-410,"r":38},{"type":"tree","x":660,"y":-140,"r":36},{"type":"tree","x":770,"y":-360,"r":42},{"type":"tree","x":-600,"y":210,"r":40},{"type":"tree","x":-720,"y":330,"r":34},{"type":"tree","x":-370,"y":420,"r":38},{"type":"tree","x":340,"y":420,"r":40},{"type":"tree","x":480,"y":500,"r":35},{"type":"tree","x":800,"y":360,"r":42},{"type":"tree","x":-900,"y":-620,"r":38},{"type":"tree","x":920,"y":-650,"r":42},{"type":"tree","x":-930,"y":660,"r":36},{"type":"tree","x":950,"y":700,"r":40},{"type":"rock","x":-260,"y":180,"r":25},{"type":"rock","x":-300,"y":240,"r":19},{"type":"rock","x":140,"y":-280,"r":23},{"type":"rock","x":710,"y":140,"r":30},{"type":"rock","x":-810,"y":-430,"r":29},{"type":"rock","x":600,"y":640,"r":27},{"type":"rock","x":-560,"y":650,"r":24},{"type":"crate","x":290,"y":50,"w":40,"h":40},{"type":"crate","x":342,"y":55,"w":40,"h":40},{"type":"crate","x":330,"y":108,"w":40,"h":40},{"type":"crate","x":-580,"y":-40,"w":40,"h":40},{"type":"crate","x":-630,"y":-40,"w":40,"h":40},{"type":"crate","x":-820,"y":510,"w":40,"h":40}];function blocked(x,y,r){for(const o of mapObjects){if(o.type==='tree'||o.type==='rock'){const radius=o.type==='tree'?11:o.r*.86;if(Math.hypot(x-o.x,y-o.y)<r+radius)return true;}else{const nx=Math.max(o.x-o.w/2,Math.min(o.x+o.w/2,x)),ny=Math.max(o.y-o.h/2,Math.min(o.y+o.h/2,y));if(Math.hypot(x-nx,y-ny)<r)return true;}}return false;}function moveOnMap(p,dx,dy,r=17){const nx=Math.max(-1200+r,Math.min(1200-r,p.x+dx)),ny=Math.max(-900+r,Math.min(900-r,p.y+dy));if(!blocked(nx,p.y,r))p.x=nx;if(!blocked(p.x,ny,r))p.y=ny;}
const world={width:2400,height:1800};function resize(){rotated=(navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches)&&innerHeight>innerWidth;document.body.classList.toggle('rotated',rotated);w=rotated?innerHeight:innerWidth;h=rotated?innerWidth:innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}addEventListener('resize',resize);resize();const movement=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];addEventListener('keydown',e=>{if(movement.includes(e.code)){e.preventDefault();keys.add(e.code);}});addEventListener('keyup',e=>keys.delete(e.code));function resetStick(){pointer=null;axisX=axisY=0;knob.style.transform='translate(0px,0px)';}function reset(){keys.clear();resetStick();inputX=inputY=0;last=0;if(session)fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,seq:++seq,x:0,y:0}),keepalive:true}).catch(()=>{});}addEventListener('blur',reset);document.addEventListener('visibilitychange',reset);function moveStick(e){if(e.pointerId!==pointer)return;const r=stick.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(rotated){const oldX=x;x=y;y=-oldX;}const len=Math.hypot(x,y),max=rotated?33:42;if(len>max){x=x/len*max;y=y/len*max;}axisX=x/max;axisY=y/max;if(Math.hypot(axisX,axisY)<.1)axisX=axisY=0;knob.style.transform=`translate(${x}px,${y}px)`;}stick.addEventListener('pointerdown',e=>{if(pointer!==null)return;e.preventDefault();pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e);});stick.addEventListener('pointermove',moveStick);for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{if(e.pointerId===pointer)resetStick();});function touchMode(){document.body.classList.add('touch');document.querySelector('#help').textContent='Джойстик слева — движение';}if(navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches)touchMode();addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchMode();},{passive:true});function frame(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;if(!document.hidden){let x=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+axisX,y=(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0)+axisY;const len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}inputX=x;inputY=y;moveOnMap(player,x*player.speed*dt,y*player.speed*dt);draw();}requestAnimationFrame(frame);}function drawMapObjects(){for(const o of mapObjects){const x=o.x,y=o.y;ctx.save();ctx.translate(x,y);if(o.type==='tree'){ctx.fillStyle='#8e7051';ctx.fillRect(-9,-3,18,27);ctx.fillStyle='#436f56';ctx.beginPath();ctx.arc(0,-9,o.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#58856a';ctx.beginPath();ctx.arc(-o.r*.22,-o.r*.48,o.r*.7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6a9776';ctx.beginPath();ctx.arc(-o.r*.35,-o.r*.62,o.r*.32,0,Math.PI*2);ctx.fill();}else if(o.type==='rock'){ctx.fillStyle='#8c9aa5';ctx.beginPath();for(let i=0;i<7;i++){const angle=i*Math.PI*2/7,r=o.r*(i%2?.86:1);const px=Math.cos(angle)*r,py=Math.sin(angle)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fill();ctx.fillStyle='#aab6bd';ctx.beginPath();ctx.moveTo(-o.r*.8,-o.r*.25);ctx.lineTo(-o.r*.2,-o.r*.85);ctx.lineTo(o.r*.55,-o.r*.65);ctx.lineTo(o.r*.1,0);ctx.closePath();ctx.fill();}else if(o.type==='crate'){ctx.fillStyle='#ac8055';ctx.fillRect(-20,-20,40,40);ctx.strokeStyle='#76583b';ctx.lineWidth=3;ctx.strokeRect(-18,-18,36,36);ctx.beginPath();ctx.moveTo(-15,-15);ctx.lineTo(15,15);ctx.moveTo(-15,15);ctx.lineTo(15,-15);ctx.stroke();}else if(o.type==='bench'){ctx.fillStyle='#58666b';ctx.fillRect(-36,-21,8,44);ctx.fillRect(28,-21,8,44);ctx.fillStyle='#b58c62';for(let i=0;i<3;i++)ctx.fillRect(-50,-16+i*12,100,9);}else if(o.type==='pond'){ctx.fillStyle='#c8d7b8';ctx.beginPath();ctx.roundRect(-o.w/2-12,-o.h/2-12,o.w+24,o.h+24,65);ctx.fill();ctx.fillStyle='#82bdce';ctx.beginPath();ctx.roundRect(-o.w/2,-o.h/2,o.w,o.h,55);ctx.fill();ctx.strokeStyle='#b2e0e7';ctx.lineWidth=2;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-80+i*28,-35+i*24);ctx.quadraticCurveTo(-45+i*28,-29+i*24,-10+i*28,-35+i*24);ctx.stroke();}ctx.fillStyle='#569571';for(const [lx,ly]of [[75,-38],[-78,38],[95,14]]){ctx.beginPath();ctx.arc(lx,ly,10,0,Math.PI*1.8);ctx.lineTo(lx,ly);ctx.fill();}}ctx.restore();}}
function draw(){ctx.fillStyle='#edf0f2';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-player.x,h/2-player.y);ctx.fillStyle='#f9fafb';ctx.fillRect(-1200,-900,2400,1800);ctx.strokeStyle='#e8edf0';ctx.lineWidth=1;const left=Math.max(-1200,Math.floor((player.x-w/2)/60)*60),right=Math.min(1200,player.x+w/2),top=Math.max(-900,Math.floor((player.y-h/2)/60)*60),bottom=Math.min(900,player.y+h/2);ctx.beginPath();for(let x=left;x<=right;x+=60){ctx.moveTo(x,-900);ctx.lineTo(x,900);}for(let y=top;y<=bottom;y+=60){ctx.moveTo(-1200,y);ctx.lineTo(1200,y);}ctx.stroke();ctx.strokeStyle='#bac7d1';ctx.lineWidth=4;ctx.strokeRect(-1200,-900,2400,1800);drawMapObjects();for(const other of others){const history=other.history,target=performance.now()-110;while(history.length>2&&history[1].t<=target)history.shift();const from=history[0],to=history[1]||from;const blend=to.t>from.t?Math.max(0,Math.min(1,(target-from.t)/(to.t-from.t))):1;other.drawX=from.x+(to.x-from.x)*blend;other.drawY=from.y+(to.y-from.y)*blend;ctx.beginPath();ctx.arc(other.drawX,other.drawY,17,0,Math.PI*2);ctx.fillStyle=other.color;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();}ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fillStyle=player.color||'#557fa0';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.beginPath();ctx.arc(player.x,player.y,3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.restore();}function leaveServer(){reset();if(session){const data=JSON.stringify(session);if(navigator.sendBeacon)navigator.sendBeacon('/leave',new Blob([data],{type:'application/json'}));else fetch('/leave',{method:'POST',headers:{'Content-Type':'application/json'},body:data,keepalive:true}).catch(()=>{});session=null;}others=[];}window.addEventListener('pagehide',leaveServer);window.addEventListener('pageshow',e=>{if(e.persisted){session=null;nextJoin=0;networkStep();}});requestAnimationFrame(frame);})();

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Полёт</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c21;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}.hint{position:fixed;left:28px;bottom:22px;color:#9cafd0;font-size:12px;letter-spacing:.5px;pointer-events:none}</style></head><body><canvas id="flight" tabindex="0" aria-label="Полёт корабля. Удерживайте пробел или экран, чтобы подняться."></canvas><div class="hint">ПРОБЕЛ / ЗАЖАТЬ ЭКРАН — ВВЕРХ</div><script>(()=>{'use strict';const canvas=document.getElementById('flight'),ctx=canvas.getContext('2d');let w=0,h=0,last=0,time=0,distance=0,keyboard=false,pointer=false;const ship={y:0,vy:0,angle:0},trail=[],sparks=[];let seed=12;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}const stars=Array.from({length:110},()=>({x:random(),y:random(),depth:.2+random()*.8,size:.7+random()*1.6}));function resize(){const oldH=h;w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);ship.y=oldH?ship.y*h/oldH:h*.5;trail.length=0;}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();keyboard=true;}});addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))keyboard=false;});canvas.addEventListener('pointerdown',e=>{pointer=true;canvas.focus();canvas.setPointerCapture(e.pointerId);});for(const event of['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>pointer=false);function release(){keyboard=pointer=false;last=0;}addEventListener('blur',release);document.addEventListener('visibilitychange',release);function path(points,fill,stroke){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}function frame(now){requestAnimationFrame(frame);if(document.hidden){last=0;return;}const dt=last?Math.min(.04,(now-last)/1000):0;last=now;time+=dt;distance+=dt*250;const thrust=keyboard||pointer;ship.vy+=(thrust?-680:490)*dt;ship.vy=Math.max(-260,Math.min(290,ship.vy));ship.y+=ship.vy*dt;const pad=Math.min(75,h*.17);if(ship.y<pad){ship.y=pad;ship.vy=Math.max(0,ship.vy);}if(ship.y>h-pad){ship.y=h-pad;ship.vy=Math.min(0,ship.vy);}const target=Math.atan2(ship.vy,420);ship.angle+=(target-ship.angle)*(1-Math.exp(-10*dt));const x=w*.29;const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#080c20');bg.addColorStop(.6,'#141438');bg.addColorStop(1,'#222044');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);for(const star of stars){const sx=((star.x*w-distance*star.depth*.24)%w+w)%w;ctx.globalAlpha=.22+star.depth*.5;ctx.fillStyle='#b2dfff';ctx.fillRect(sx,star.y*h,star.size,star.size);}ctx.globalAlpha=1;ctx.strokeStyle='#6461ad18';ctx.lineWidth=1;const grid=72,shift=distance*.4%grid;ctx.beginPath();for(let gx=-shift;gx<w;gx+=grid){ctx.moveTo(gx,0);ctx.lineTo(gx,h);}for(let gy=0;gy<h;gy+=grid){ctx.moveTo(0,gy);ctx.lineTo(w,gy);}ctx.stroke();for(let layer=0;layer<2;layer++){const speed=layer? .7:.28,base=layer?h*.91:h*.84;ctx.fillStyle=layer?'#242341':'#1d1b38';ctx.beginPath();ctx.moveTo(0,h);for(let gx=-80;gx<=w+80;gx+=55){const world=gx+distance*speed,yy=base-Math.abs(Math.sin(world*.007)+Math.sin(world*.013)*.45)*(layer?30:50);ctx.lineTo(gx,yy);}ctx.lineTo(w,h);ctx.closePath();ctx.fill();}for(const p of trail){p.x-=250*dt;p.life-=dt;}trail.push({x:x-25,y:ship.y,life:.55});while(trail.length&&(trail[0].life<=0||trail.length>60))trail.shift();if(trail.length>1){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';for(let i=1;i<trail.length;i++){const p=trail[i],prev=trail[i-1];ctx.globalAlpha=Math.max(0,p.life/.55)*.55;ctx.strokeStyle='#53e5f8';ctx.lineWidth=2+4*p.life/.55;ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();}ctx.restore();}if(dt&&sparks.length<80)sparks.push({x:x-24,y:ship.y+(random()-.5)*10,vx:120+random()*100,vy:(random()-.5)*45,life:.2+random()*.25});for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x-=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0){sparks.splice(i,1);continue;}ctx.globalAlpha=Math.min(1,p.life*3);ctx.fillStyle='#8cedff';ctx.fillRect(p.x,p.y,2,2);}ctx.globalAlpha=1;ctx.save();ctx.translate(x,ship.y);ctx.rotate(ship.angle);ctx.shadowColor='#35d6ff';ctx.shadowBlur=12;const flame=22+(thrust?14:0)+Math.sin(time*22)*2;path([[-23,-7],[-23-flame,0],[-23,7]],'#56dcff');ctx.shadowBlur=0;path([[-23,-3],[-37-(thrust?8:0),0],[-23,3]],'#e0fcff');path([[-26,-9],[-5,-9],[8,-18],[15,-18],[10,-7],[31,0],[10,8],[0,17],[-11,17],[-7,7],[-26,7],[-20,0]],'#50cde2','#b7f7ff');path([[-19,-5],[4,-5],[17,0],[1,8],[-12,8]],'#247caa');path([[-12,-17],[3,-17],[3,-3],[-12,-3]],'#7aeecc','#d1fff2');ctx.fillStyle='#173f58';ctx.fillRect(-9,-13,3,3);ctx.fillRect(-2,-13,3,3);ctx.fillRect(-8,-7,7,2);path([[7,-3],[23,0],[7,4]],'#dbffff');ctx.restore();}requestAnimationFrame(frame);})();</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

<html lang="ru"><head><meta charset="UTF-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#edf0f2"><title>Новая игра</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf0f2;font-family:Arial,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}.hint{position:fixed;top:calc(20px + env(safe-area-inset-top));left:20px;color:#65717b;font-size:13px;pointer-events:none}.hint strong{display:block;margin-bottom:6px;font-size:16px;color:#36434e}#stick{position:fixed;left:calc(25px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:132px;height:132px;border:1px solid #697e913b;border-radius:50%;background:#72899c12;touch-action:none;display:none}#knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:#5a758db3;border:2px solid #ffffffb0;pointer-events:none}body.touch #stick{display:block}@media(pointer:coarse){#stick{display:block}}.hint span{opacity:.85}#gameScreen{position:fixed;inset:0;overflow:hidden;width:100%;height:100%}body.rotated #gameScreen{inset:auto;left:50%;top:50%;width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}body.rotated .hint{top:16px;left:20px}body.rotated #stick{left:25px;bottom:22px;width:116px;height:116px}body.rotated #knob{left:33px;top:33px}.update-banner{position:absolute;z-index:100;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);padding:13px 23px;border:1px solid #adc7bb;border-radius:13px;background:#f5fffa;color:#345c48;box-shadow:0 5px 22px #29453420;text-align:center;pointer-events:none;animation:updateBanner 4s ease both}.update-banner strong{display:block;font-size:15px}.update-banner span{display:block;margin-top:5px;font-size:12px;color:#668373}@keyframes updateBanner{0%{opacity:0;translate:0 -18px}12%,78%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -12px}}@media(prefers-reduced-motion:reduce){.update-banner{animation-name:updateBannerQuiet}@keyframes updateBannerQuiet{0%,100%{opacity:0}12%,78%{opacity:1}}}#nameOverlay{position:absolute;inset:0;z-index:200;display:grid;place-items:center;background:#edf0f2eb;padding:18px}#nameOverlay[hidden]{display:none}#nameForm{width:min(340px,100%);padding:25px;background:#fff;border:1px solid #dce4ea;border-radius:20px;box-shadow:0 12px 45px #39516912;text-align:center}#nameForm h1{font-size:23px;margin:0 0 10px;color:#344450}#nameForm p{font-size:13px;color:#71808a;margin:0 0 20px}#nickname{width:100%;border:1px solid #c9d6df;border-radius:10px;font-size:16px;padding:12px;outline-color:#557fa0;user-select:text;-webkit-user-select:text;touch-action:manipulation}#nameForm button{width:100%;margin:12px 0;border:0;border-radius:10px;background:#557fa0;color:white;padding:13px;font-size:16px;cursor:pointer}#nameForm small{display:block;color:#8a969e;font-size:11px}#nameError{color:#a44;font-size:12px;margin-top:7px}@media(max-height:430px){#nameForm{padding:16px}#nameForm p{margin-bottom:12px}}#rotateHint{display:none;position:fixed;inset:0;z-index:1000;background:#edf0f2;align-items:center;justify-content:center;text-align:center;padding:28px;color:#344450}#rotateHint strong{font-size:23px}#rotateHint p{font-size:14px;line-height:1.6;color:#71808a;max-width:280px}.rotate-icon{font-size:65px;margin-bottom:22px;color:#557fa0}@media(orientation:portrait){body.touch #rotateHint{display:flex}}
</style></head><body><!-- Updater compatibility: simple-coin-clicker.v1 --><div id="rotateHint" role="status"><div><div class="rotate-icon">↻</div><strong>Поверни телефон</strong><p>Держи телефон горизонтально, чтобы играть</p></div></div><div id="gameScreen"><div id="nameOverlay"><form id="nameForm"><h1>Как тебя зовут?</h1><p>Этот ник увидят другие игроки</p><input id="nickname" type="text" maxlength="40" placeholder="Твой ник" aria-label="Ник игрока" autocomplete="nickname" enterkeyhint="go" required><button type="submit">Играть</button><small>Ник сохранится на этом устройстве</small><div id="nameError" role="status"></div></form></div><canvas id="game" aria-label="Двумерная игра, вид сверху. Управление WASD, стрелками или джойстиком."></canvas><div class="hint"><strong>Новая игра · вид сверху</strong><div id="networkStatus" style="margin:6px 0;color:#687b89">Подключение…</div><span id="help">WASD / стрелки — движение</span></div><div id="stick" role="group" aria-label="Джойстик движения"><div id="knob"></div></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),keys=new Set();const player={x:0,y:0,r:17,speed:225};let rotated=false,w=0,h=0,dpr=1,axisX=0,axisY=0,pointer=null,last=0;const CLICK_KEY='topdown-game.button-clicks';let buttonClicks=0,nextButtonClickAt=0,buttonReleaseAt=0;try{const value=Number(localStorage.getItem(CLICK_KEY));if(Number.isSafeInteger(value)&&value>=0)buttonClicks=value;}catch(e){}function updateLocalButton(){const onButton=!!nickname&&Math.hypot(player.x-150,player.y)<38,now=performance.now();if(onButton&&now>=nextButtonClickAt){buttonReleaseAt=now+2000;nextButtonClickAt=now+2500;buttonClicks=Math.min(Number.MAX_SAFE_INTEGER,buttonClicks+1);try{localStorage.setItem(CLICK_KEY,String(buttonClicks));}catch(e){}}}
const NAME_KEY='topdown-game.nickname';function cleanName(value){return [...value.replace(/[\x00-\x1f\x7f-\x9f\u200b-\u200f\u202a-\u202e\u2060-\u206f]/g,'').trim()].slice(0,20).join('');}let nickname='';try{nickname=cleanName(localStorage.getItem(NAME_KEY)||'');}catch(e){}const nameOverlay=document.querySelector('#nameOverlay'),nameInput=document.querySelector('#nickname');if(nickname)nameOverlay.hidden=true;document.querySelector('#nameForm').addEventListener('submit',e=>{e.preventDefault();const name=cleanName(nameInput.value);if(!name){document.querySelector('#nameError').textContent='Введи ник от 1 до 20 символов';return;}nickname=name;try{localStorage.setItem(NAME_KEY,nickname);}catch(e){}nameOverlay.hidden=true;nameInput.blur();keys.clear();nextJoin=0;networkStep();});
let session=null,seq=0,pendingMoves=[],networkBusy=false,inputX=0,inputY=0,others=[],online=false,nextJoin=0;const netStatus=document.querySelector('#networkStatus');async function request(url,data){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),3500);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal});if(!r.ok){if(r.status===401)session=null;throw Error('Connection');}return await r.json();}finally{clearTimeout(timeout);}}function applyState(list,joining=false){if(!Array.isArray(list))return;const me=list.find(p=>p.id===session?.id);if(me){if(joining){pendingMoves=[];seq=me.ack||0;}else pendingMoves=pendingMoves.filter(cmd=>cmd.seq>me.ack);player.x=me.x;player.y=me.y;for(const cmd of pendingMoves)moveOnMap(player,cmd.x*player.speed*cmd.dt,cmd.y*player.speed*cmd.dt);player.color=me.color;}const old=new Map(others.map(p=>[p.id,p])),received=performance.now();others=list.filter(p=>p.id!==session?.id).map(p=>{const history=old.get(p.id)?.history||[];history.push({t:received,x:p.x,y:p.y});while(history.length>12)history.shift();return {...p,history};});online=true;netStatus.textContent='В сети: '+list.length+' · ты — кружок с точкой';}async function networkStep(){if(!nickname||networkBusy||Date.now()<nextJoin)return;networkBusy=true;try{if(!session){let resume=null;try{resume=JSON.parse(sessionStorage.getItem('topdown-game.session')||'null');}catch(e){}const d=await request('/join',{name:nickname,resume,clicks:buttonClicks});session={id:d.id,token:d.token};try{sessionStorage.setItem('topdown-game.session',JSON.stringify(session));}catch(e){}applyState(d.players,true);}else{const d=await request('/input',{...session,commands:pendingMoves.slice(0,120),clicks:buttonClicks});applyState(d.players);if(d.version)checkVersion(d.version,d.updateAt,d.serverTime);}}catch(e){online=false;netStatus.textContent=updatePending?'Обновление сервера · переподключение…':'Переподключение · игроки временно на паузе';nextJoin=Date.now()+500;}finally{networkBusy=false;}}function showUpdateBanner(duration=4000){if(document.querySelector('.update-banner'))return;const banner=document.createElement('div');banner.className='update-banner';banner.style.animationDuration=duration+'ms';banner.setAttribute('role','status');const title=document.createElement('strong');title.textContent='Вышло обновление';const detail=document.createElement('span');detail.textContent='Сейчас загрузим новую версию';banner.append(title,detail);document.querySelector('#gameScreen').append(banner);setTimeout(()=>banner.remove(),duration+50);}
let gameVersion='__GAME_VERSION__',updatePending=false;if(!/^[a-f0-9]{64}$/.test(gameVersion))gameVersion=null;let lastAutoReload={};try{lastAutoReload=JSON.parse(sessionStorage.getItem('new-game.last-auto-reload')||'{}');}catch(e){}function checkVersion(v,at,serverTime,rtt=0){if(!/^[a-f0-9]{64}$/.test(v))return;if(!gameVersion){gameVersion=v;return;}if(v===gameVersion||updatePending||lastAutoReload.version===v||!Number.isFinite(at)||!Number.isFinite(serverTime))return;updatePending=true;const remaining=Math.max(200,at-serverTime-rtt/2);showUpdateBanner(remaining);setTimeout(()=>{try{sessionStorage.setItem('new-game.last-auto-reload',JSON.stringify({version:v,at:Date.now()}));}catch(e){}const url=new URL(location.href);url.searchParams.set('build',v.slice(0,12));location.replace(url.href);},remaining);}let versionChecking=false;async function pollVersion(){if(versionChecking||document.hidden)return;versionChecking=true;const started=performance.now();try{const r=await fetch('/update-status?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(r.ok){const d=await r.json();checkVersion(d.version,d.updateAt,d.serverTime,performance.now()-started);}}catch(e){}finally{versionChecking=false;}}pollVersion();setInterval(pollVersion,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollVersion();});setInterval(networkStep,50);setTimeout(networkStep,0);
const mapObjects=[];function blocked(x,y,r){for(const o of mapObjects){if(o.type==='tree'||o.type==='rock'){const radius=o.type==='tree'?11:o.r*.86;if(Math.hypot(x-o.x,y-o.y)<r+radius)return true;}else{const nx=Math.max(o.x-o.w/2,Math.min(o.x+o.w/2,x)),ny=Math.max(o.y-o.h/2,Math.min(o.y+o.h/2,y));if(Math.hypot(x-nx,y-ny)<r)return true;}}return false;}function moveOnMap(p,dx,dy,r=17){const nx=Math.max(-750+r,Math.min(750-r,p.x+dx)),ny=Math.max(-750+r,Math.min(750-r,p.y+dy));if(!blocked(nx,p.y,r))p.x=nx;if(!blocked(p.x,ny,r))p.y=ny;}
const world={width:1500,height:1500};function resize(){if(typeof keys!=='undefined')keys.clear();axisX=axisY=0;rotated=false;document.body.classList.remove('rotated');w=rotated?innerHeight:innerWidth;h=rotated?innerWidth:innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}addEventListener('resize',resize);resize();const movement=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||!nickname)return;if(movement.includes(e.code)){e.preventDefault();keys.add(e.code);}});addEventListener('keyup',e=>keys.delete(e.code));function resetStick(){pointer=null;axisX=axisY=0;knob.style.transform='translate(0px,0px)';}function reset(){keys.clear();resetStick();inputX=inputY=0;last=0;if(session)fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,commands:[]}),keepalive:true}).catch(()=>{});}addEventListener('blur',reset);document.addEventListener('visibilitychange',reset);function moveStick(e){if(e.pointerId!==pointer)return;const r=stick.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(rotated){const oldX=x;x=y;y=-oldX;}const len=Math.hypot(x,y),max=rotated?33:42;if(len>max){x=x/len*max;y=y/len*max;}axisX=x/max;axisY=y/max;if(Math.hypot(axisX,axisY)<.1)axisX=axisY=0;knob.style.transform=`translate(${x}px,${y}px)`;}stick.addEventListener('pointerdown',e=>{if(pointer!==null)return;e.preventDefault();pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e);});stick.addEventListener('pointermove',moveStick);for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{if(e.pointerId===pointer)resetStick();});function touchMode(){document.body.classList.add('touch');document.querySelector('#help').textContent='Джойстик слева — движение';}if(navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches)touchMode();addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchMode();},{passive:true});function frame(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;if(!document.hidden){let x=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+axisX,y=(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0)+axisY;const len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}if(!nickname||(document.body.classList.contains('touch')&&innerHeight>innerWidth))x=y=0;inputX=x;inputY=y;if(session&&dt>0&&pendingMoves.length<240){pendingMoves.push({seq:++seq,x,y,dt});moveOnMap(player,x*player.speed*dt,y*player.speed*dt);}else if(!session)moveOnMap(player,x*player.speed*dt,y*player.speed*dt);updateLocalButton();draw();}requestAnimationFrame(frame);}function drawPlayerName(name,x,y,clicks=0){ctx.save();ctx.font='600 13px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='#ffffffed';ctx.fillStyle='#f4f5f7';ctx.fillText(name,x,y-43);if(name==='acedia'){const badgeX=x+ctx.measureText(name).width/2+8,badgeY=y-50;ctx.beginPath();ctx.arc(badgeX,badgeY,5,0,Math.PI*2);ctx.fillStyle='#3899ec';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(badgeX-2.2,badgeY);ctx.lineTo(badgeX-.6,badgeY+1.5);ctx.lineTo(badgeX+2.3,badgeY-1.8);ctx.stroke();}ctx.font='11px Arial';ctx.textBaseline='top';ctx.lineWidth=3;const counter=(Number.isSafeInteger(clicks)&&clicks>=0?clicks:0).toLocaleString('ru-RU')+' кликов';ctx.strokeStyle='#ffffffed';ctx.fillStyle='#c9cdd4';ctx.fillText(counter,x,y-39);ctx.restore();}
let buttonGlow=0;function drawGroundButton(){const now=performance.now(),pressed=now<buttonReleaseAt,cooling=now<nextButtonClickAt;buttonGlow+=(Number(pressed)-buttonGlow)*.22;const depth=-5+buttonGlow*6;ctx.save();ctx.translate(150,0);ctx.fillStyle='#292d34';ctx.beginPath();ctx.ellipse(0,6,37,33,0,0,Math.PI*2);ctx.fill();const metal=ctx.createLinearGradient(-30,-35,30,35);metal.addColorStop(0,'#9aa4b2');metal.addColorStop(.36,'#5a6370');metal.addColorStop(1,'#303641');ctx.fillStyle=metal;ctx.beginPath();ctx.arc(0,0,36,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a8b2c066';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#20252c';ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();for(let i=0;i<4;i++){const angle=Math.PI/4+i*Math.PI/2,x=Math.cos(angle)*31,y=Math.sin(angle)*31;ctx.fillStyle='#222831';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#909ba8';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x-1,y);ctx.lineTo(x+1,y);ctx.stroke();}ctx.fillStyle='#813e32';ctx.beginPath();ctx.arc(0,3,24,0,Math.PI*2);ctx.fill();const cap=ctx.createLinearGradient(0,-26+depth,0,26+depth);cap.addColorStop(0,pressed?'#b66e56':'#f7ac79');cap.addColorStop(.55,pressed?'#a65b48':'#e4815f');cap.addColorStop(1,pressed?'#844739':'#bc5c49');ctx.fillStyle=cap;ctx.beginPath();ctx.arc(0,depth,24,0,Math.PI*2);ctx.fill();ctx.strokeStyle=pressed?'#d78e6955':'#ffd4a58c';ctx.lineWidth=1;ctx.stroke();ctx.strokeStyle=pressed?'#dfaa8d':'#fff0d6';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,depth,7,-Math.PI*.3,Math.PI*1.3);ctx.stroke();ctx.beginPath();ctx.moveTo(0,depth-10);ctx.lineTo(0,depth-2);ctx.stroke();ctx.strokeStyle='#ffffff1a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,39,-Math.PI/2,Math.PI*1.5);ctx.stroke();const progress=cooling?Math.max(0,Math.min(1,1-(nextButtonClickAt-now)/2500)):1;ctx.strokeStyle=cooling?'#e9b98b':'#97d9b3';ctx.beginPath();ctx.arc(0,0,39,-Math.PI/2,-Math.PI/2+Math.PI*2*progress);ctx.stroke();ctx.font='11px Arial';ctx.textAlign='center';ctx.fillStyle='#e1e4e9';ctx.fillText(cooling?(Math.max(0,nextButtonClickAt-now)/1000).toFixed(1)+' с':'Наступи · +1 клик',0,59);ctx.restore();}

function draw(){ctx.fillStyle='#30343a';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-player.x,h/2-player.y);ctx.fillStyle='#777b80';ctx.fillRect(-750,-750,1500,1500);const left=Math.max(0,Math.floor((player.x-w/2+750)/60)),right=Math.min(24,Math.floor((player.x+w/2+750)/60)),top=Math.max(0,Math.floor((player.y-h/2+750)/60)),bottom=Math.min(24,Math.floor((player.y+h/2+750)/60));ctx.fillStyle='#51555b';for(let row=top;row<=bottom;row++){for(let col=left;col<=right;col++){if((row+col)%2)ctx.fillRect(-750+col*60,-750+row*60,60,60);}}ctx.strokeStyle='#3e4248';ctx.lineWidth=4;ctx.strokeRect(-750,-750,1500,1500);drawGroundButton();for(const other of others){const history=other.history,target=performance.now()-110;while(history.length>2&&history[1].t<=target)history.shift();const from=history[0],to=history[1]||from;const blend=to.t>from.t?Math.max(0,Math.min(1,(target-from.t)/(to.t-from.t))):1;other.drawX=from.x+(to.x-from.x)*blend;other.drawY=from.y+(to.y-from.y)*blend;ctx.beginPath();ctx.arc(other.drawX,other.drawY,17,0,Math.PI*2);ctx.fillStyle=other.color;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();drawPlayerName(other.name||'Игрок',other.drawX,other.drawY,other.clicks);}ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fillStyle=player.color||'#557fa0';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.beginPath();ctx.arc(player.x,player.y,3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();if(nickname)drawPlayerName(nickname,player.x,player.y,buttonClicks);ctx.restore();}function leaveServer(){reset();if(session){const data=JSON.stringify(session);if(navigator.sendBeacon)navigator.sendBeacon('/leave',new Blob([data],{type:'application/json'}));else fetch('/leave',{method:'POST',headers:{'Content-Type':'application/json'},body:data,keepalive:true}).catch(()=>{});session=null;}others=[];}window.addEventListener('pagehide',leaveServer);window.addEventListener('pageshow',e=>{if(e.persisted){session=null;nextJoin=0;networkStep();}});requestAnimationFrame(frame);})();
</script></body></html>

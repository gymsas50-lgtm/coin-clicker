<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вид сверху</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eff1ee;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}.hint{position:fixed;left:24px;bottom:24px;color:#626d67;font-size:13px;pointer-events:none;background:#ffffffd9;padding:12px 16px;border:1px solid #dce1da;border-radius:12px}kbd{font:600 12px system-ui;display:inline-block;padding:3px 6px;margin:0 2px;background:white;border:1px solid #dce1da;border-radius:4px;color:#293e34}.label{position:fixed;top:24px;left:26px;font-size:11px;letter-spacing:2px;color:#819087;pointer-events:none}</style></head><body><canvas id="game" tabindex="0" aria-label="Игровое поле. Ходьба на WASD или стрелках."></canvas><div class="label">ВИД СВЕРХУ / 2D</div><div class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — ходьба · ЛКМ — копать <span style="opacity:.55">· или стрелки</span></div><script>(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),keys=new Set(),player={x:0,y:0,angle:0,phase:0,moving:false},camera={x:0,y:0};const blocks=[],openCells=new Set(),blockMap=new Map(),cellKey=(x,y)=>x+','+y;function addBlock(gx,gy){const key=cellKey(gx,gy);if(openCells.has(key)||blockMap.has(key))return;const block={gx,gy,x:gx*28,y:gy*28,size:28,tile:Math.abs((gx*73856093)^(gy*19349663))%6};blocks.push(block);blockMap.set(key,block);}for(let gy=-4;gy<=4;gy++)for(let gx=-6;gx<=6;gx++)openCells.add(cellKey(gx,gy));for(let gy=-5;gy<=5;gy++)for(let gx=-7;gx<=7;gx++)if(Math.abs(gx)===7||Math.abs(gy)===5)addBlock(gx,gy);const dirtTiles=[];let soilSeed=921;function soilRandom(){soilSeed=(soilSeed*1664525+1013904223)>>>0;return soilSeed/4294967296;}for(let n=0;n<6;n++){const tile=document.createElement('canvas');tile.width=tile.height=56;const g=tile.getContext('2d');g.fillStyle='#806044';g.fillRect(0,0,56,56);for(let i=0;i<650;i++){g.fillStyle=['#6b4e36','#906d4d','#76563b','#a17c56','#594432'][Math.floor(soilRandom()*5)];const size=1+soilRandom()*3;g.fillRect(soilRandom()*56,soilRandom()*56,size,size*.65);}for(let i=0;i<9;i++){const x=soilRandom()*56,y=soilRandom()*56;g.fillStyle='#594631';g.beginPath();g.ellipse(x,y,1+soilRandom()*2,.7+soilRandom()*1.3,soilRandom()*3,0,Math.PI*2);g.fill();}dirtTiles.push(tile);}blocks.forEach((block,i)=>block.tile=i%dirtTiles.length);function resolveCollision(){for(const block of blocks){const half=block.size/2,nearX=Math.max(block.x-half,Math.min(player.x,block.x+half)),nearY=Math.max(block.y-half,Math.min(player.y,block.y+half)),vx=player.x-nearX,vy=player.y-nearY,distance=Math.hypot(vx,vy);if(distance>0&&distance<14){const push=14-distance;player.x+=vx/distance*push;player.y+=vy/distance*push;}}}function movePlayer(mx,my){const count=Math.max(1,Math.ceil(Math.hypot(mx,my)/4));for(let i=0;i<count;i++){player.x+=mx/count;resolveCollision();player.y+=my/count;resolveCollision();}}let w=0,h=0,last=0;function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);}addEventListener('resize',resize);resize();const codes=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight'];addEventListener('keydown',e=>{if(codes.includes(e.code)){e.preventDefault();keys.add(e.code);}});addEventListener('keyup',e=>keys.delete(e.code));function clear(){keys.clear();last=0;}addEventListener('blur',clear);document.addEventListener('visibilitychange',clear);canvas.addEventListener('pointerdown',event=>{canvas.focus();if(event.button!==0)return;const rect=canvas.getBoundingClientRect(),worldX=(event.clientX-rect.left)*w/rect.width-w/2+camera.x,worldY=(event.clientY-rect.top)*h/rect.height-h/2+camera.y,gx=Math.floor((worldX+14)/28),gy=Math.floor((worldY+14)/28),key=cellKey(gx,gy),block=blockMap.get(key);if(!block)return;blockMap.delete(key);blocks.splice(blocks.indexOf(block),1);openCells.add(key);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])addBlock(gx+dx,gy+dy);});function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}function frame(now){requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.05):0;last=now;let dx=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),dy=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));const length=Math.hypot(dx,dy);player.moving=length>0;if(length){dx/=length;dy/=length;movePlayer(dx*190*dt,dy*190*dt);const target=Math.atan2(dy,dx)+Math.PI/2,delta=Math.atan2(Math.sin(target-player.angle),Math.cos(target-player.angle));player.angle+=delta*(1-Math.exp(-20*dt));player.phase+=dt*13;}const follow=1-Math.exp(-7*dt);camera.x+=(player.x-camera.x)*follow;camera.y+=(player.y-camera.y)*follow;ctx.fillStyle='#eff1ee';ctx.fillRect(0,0,w,h);const ox=w/2-camera.x,oy=h/2-camera.y,grid=64;ctx.strokeStyle='#e1e6df';ctx.lineWidth=1;ctx.beginPath();for(let x=((ox%grid)+grid)%grid;x<w;x+=grid){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,h);}for(let y=((oy%grid)+grid)%grid;y<h;y+=grid){ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(w,Math.round(y)+.5);}ctx.stroke();ctx.save();ctx.beginPath();ctx.rect(0,0,w,h);for(const key of openCells){const[gx,gy]=key.split(',').map(Number),left=ox+gx*28-14,top=oy+gy*28-14;if(left+28<0||top+28<0||left>w||top>h)continue;ctx.rect(left,top,28,28);}ctx.fillStyle='#171819';ctx.fill('evenodd');ctx.restore();ctx.strokeStyle='#c8d3c9';ctx.beginPath();ctx.arc(ox,oy,6,0,Math.PI*2);ctx.stroke();for(const block of blocks){const bx=ox+block.x,by=oy+block.y,k=block.size;ctx.imageSmoothingEnabled=false;ctx.drawImage(dirtTiles[block.tile],bx-k/2,by-k/2,k,k);ctx.fillStyle='#c49b6733';ctx.fillRect(bx-k/2,by-k/2,k,1);ctx.fillStyle='#32221955';ctx.fillRect(bx-k/2,by+k/2-2,k,2);ctx.strokeStyle='#513a293b';ctx.lineWidth=1;ctx.strokeRect(bx-k/2+.5,by-k/2+.5,k-1,k-1);} const px=player.x+ox,py=player.y+oy,step=player.moving?Math.sin(player.phase)*5:0;ellipse(px+2,py+8,19,12,'#1c342323');ctx.save();ctx.translate(px,py);ctx.rotate(player.angle);ellipse(0,0,14,14,'#477f61');ctx.restore();}window.gamePlayer=player;requestAnimationFrame(frame);})();</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

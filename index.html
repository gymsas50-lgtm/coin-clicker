<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#edf0f2"><title>Новая игра</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf0f2;font-family:Arial,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}.hint{position:fixed;top:calc(20px + env(safe-area-inset-top));left:20px;color:#65717b;font-size:13px;pointer-events:none}.hint strong{display:block;margin-bottom:6px;font-size:16px;color:#36434e}#stick{position:fixed;left:calc(25px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:132px;height:132px;border:1px solid #697e913b;border-radius:50%;background:#72899c12;touch-action:none;display:none}#knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:#5a758db3;border:2px solid #ffffffb0;pointer-events:none}body.touch #stick{display:block}@media(pointer:coarse){#stick{display:block}}.hint span{opacity:.85}#gameScreen{position:fixed;inset:0;overflow:hidden;width:100%;height:100%}body.rotated #gameScreen{inset:auto;left:50%;top:50%;width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}body.rotated .hint{top:16px;left:20px}body.rotated #stick{left:25px;bottom:22px;width:116px;height:116px}body.rotated #knob{left:33px;top:33px}</style></head><body><!-- Updater compatibility: simple-coin-clicker.v1 --><div id="gameScreen"><canvas id="game" aria-label="Двумерная игра, вид сверху. Управление WASD, стрелками или джойстиком."></canvas><div class="hint"><strong>Новая игра · вид сверху</strong><div id="networkStatus" style="margin:6px 0;color:#687b89">Подключение…</div><span id="help">WASD / стрелки — движение</span></div><div id="stick" role="group" aria-label="Джойстик движения"><div id="knob"></div></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),keys=new Set();const player={x:0,y:0,r:17,speed:225};let rotated=false,w=0,h=0,dpr=1,axisX=0,axisY=0,pointer=null,last=0;let session=null,seq=0,networkBusy=false,inputX=0,inputY=0,others=[],online=false,nextJoin=0;const netStatus=document.querySelector('#networkStatus');async function request(url,data){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),3500);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal});if(!r.ok){if(r.status===401)session=null;throw Error('Connection');}return await r.json();}finally{clearTimeout(timeout);}}function applyState(list,joining=false){if(!Array.isArray(list))return;const me=list.find(p=>p.id===session?.id);if(me){if(joining||Math.hypot(me.x-player.x,me.y-player.y)>100){player.x=me.x;player.y=me.y;}else{player.x+=(me.x-player.x)*.25;player.y+=(me.y-player.y)*.25;}player.color=me.color;}const old=new Map(others.map(p=>[p.id,p]));others=list.filter(p=>p.id!==session?.id).map(p=>({...p,drawX:old.get(p.id)?.drawX??p.x,drawY:old.get(p.id)?.drawY??p.y}));online=true;netStatus.textContent='В сети: '+list.length+' · ты — кружок с точкой';}async function networkStep(){if(networkBusy||document.hidden||Date.now()<nextJoin)return;networkBusy=true;try{if(!session){const d=await request('/join',{});session={id:d.id,token:d.token};applyState(d.players,true);}else{const d=await request('/input',{...session,seq:++seq,x:inputX,y:inputY});applyState(d.players);if(d.version)checkVersion(d.version);}}catch(e){online=false;netStatus.textContent='Нет связи · повторное подключение…';nextJoin=Date.now()+1800;}finally{networkBusy=false;}}let gameVersion=null,updatePending=false;function checkVersion(v){if(!gameVersion){gameVersion=v;return;}if(v!==gameVersion&&!updatePending){updatePending=true;netStatus.textContent='Вышло обновление · загружаем…';setTimeout(()=>location.reload(),1200);}}fetch('/version',{cache:'no-store'}).then(r=>r.ok?r.text():null).then(v=>{if(v&&/^[a-f0-9]{64}$/.test(v.trim()))gameVersion=v.trim();}).catch(()=>{});setInterval(networkStep,100);setTimeout(networkStep,0);
const world={width:2400,height:1800};function resize(){rotated=(navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches)&&innerHeight>innerWidth;document.body.classList.toggle('rotated',rotated);w=rotated?innerHeight:innerWidth;h=rotated?innerWidth:innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}addEventListener('resize',resize);resize();const movement=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];addEventListener('keydown',e=>{if(movement.includes(e.code)){e.preventDefault();keys.add(e.code);}});addEventListener('keyup',e=>keys.delete(e.code));function resetStick(){pointer=null;axisX=axisY=0;knob.style.transform='translate(0px,0px)';}function reset(){keys.clear();resetStick();inputX=inputY=0;last=0;if(session)fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,seq:++seq,x:0,y:0}),keepalive:true}).catch(()=>{});}addEventListener('blur',reset);document.addEventListener('visibilitychange',reset);function moveStick(e){if(e.pointerId!==pointer)return;const r=stick.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(rotated){const oldX=x;x=y;y=-oldX;}const len=Math.hypot(x,y),max=rotated?33:42;if(len>max){x=x/len*max;y=y/len*max;}axisX=x/max;axisY=y/max;if(Math.hypot(axisX,axisY)<.1)axisX=axisY=0;knob.style.transform=`translate(${x}px,${y}px)`;}stick.addEventListener('pointerdown',e=>{if(pointer!==null)return;e.preventDefault();pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e);});stick.addEventListener('pointermove',moveStick);for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{if(e.pointerId===pointer)resetStick();});function touchMode(){document.body.classList.add('touch');document.querySelector('#help').textContent='Джойстик слева — движение';}if(navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches)touchMode();addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchMode();},{passive:true});function frame(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;if(!document.hidden){let x=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+axisX,y=(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0)+axisY;const len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}inputX=x;inputY=y;player.x=Math.max(-world.width/2+player.r,Math.min(world.width/2-player.r,player.x+x*player.speed*dt));player.y=Math.max(-world.height/2+player.r,Math.min(world.height/2-player.r,player.y+y*player.speed*dt));draw();}requestAnimationFrame(frame);}function draw(){ctx.fillStyle='#edf0f2';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-player.x,h/2-player.y);ctx.fillStyle='#f9fafb';ctx.fillRect(-1200,-900,2400,1800);ctx.strokeStyle='#e8edf0';ctx.lineWidth=1;const left=Math.max(-1200,Math.floor((player.x-w/2)/60)*60),right=Math.min(1200,player.x+w/2),top=Math.max(-900,Math.floor((player.y-h/2)/60)*60),bottom=Math.min(900,player.y+h/2);ctx.beginPath();for(let x=left;x<=right;x+=60){ctx.moveTo(x,-900);ctx.lineTo(x,900);}for(let y=top;y<=bottom;y+=60){ctx.moveTo(-1200,y);ctx.lineTo(1200,y);}ctx.stroke();ctx.strokeStyle='#bac7d1';ctx.lineWidth=4;ctx.strokeRect(-1200,-900,2400,1800);for(const other of others){other.drawX+=(other.x-other.drawX)*.22;other.drawY+=(other.y-other.drawY)*.22;ctx.beginPath();ctx.arc(other.drawX,other.drawY,17,0,Math.PI*2);ctx.fillStyle=other.color;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();}ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fillStyle=player.color||'#557fa0';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.beginPath();ctx.arc(player.x,player.y,3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.restore();}window.addEventListener('pagehide',reset);requestAnimationFrame(frame);})();
</script></body></html>

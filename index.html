<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вид сверху</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eff1ee;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}.hint{position:fixed;left:24px;bottom:24px;color:#626d67;font-size:13px;pointer-events:none;background:#ffffffd9;padding:12px 16px;border:1px solid #dce1da;border-radius:12px}kbd{font:600 12px system-ui;display:inline-block;padding:3px 6px;margin:0 2px;background:white;border:1px solid #dce1da;border-radius:4px;color:#293e34}.label{position:fixed;top:24px;left:26px;font-size:11px;letter-spacing:2px;color:#819087;pointer-events:none}</style></head><body><canvas id="game" tabindex="0" aria-label="Игровое поле. Ходьба на WASD или стрелках."></canvas><div class="label">ВИД СВЕРХУ / 2D</div><div class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — ходьба · ЛКМ — копать <span style="opacity:.55">· или стрелки</span></div><script>(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),keys=new Set(),player={x:0,y:0,angle:0,phase:0,moving:false},camera={x:0,y:0};const brokenPieces=[],revealedAt=new Map();const blocks=[],openCells=new Set(),blockMap=new Map(),cellKey=(x,y)=>x+','+y;function addBlock(gx,gy){const key=cellKey(gx,gy);if(openCells.has(key)||blockMap.has(key))return;const block={gx,gy,x:gx*28,y:gy*28,size:28,born:performance.now(),tile:Math.abs((gx*73856093)^(gy*19349663))%6};blocks.push(block);blockMap.set(key,block);}for(let gy=-4;gy<=4;gy++)for(let gx=-6;gx<=6;gx++)openCells.add(cellKey(gx,gy));for(let gy=-5;gy<=5;gy++)for(let gx=-7;gx<=7;gx++)if(Math.abs(gx)===7||Math.abs(gy)===5)addBlock(gx,gy);const dirtTiles=[];let soilSeed=921;function soilRandom(){soilSeed=(soilSeed*1664525+1013904223)>>>0;return soilSeed/4294967296;}for(let n=0;n<6;n++){const tile=document.createElement('canvas');tile.width=tile.height=56;const g=tile.getContext('2d');g.fillStyle='#806044';g.fillRect(0,0,56,56);for(let i=0;i<650;i++){g.fillStyle=['#6b4e36','#906d4d','#76563b','#a17c56','#594432'][Math.floor(soilRandom()*5)];const size=1+soilRandom()*3;g.fillRect(soilRandom()*56,soilRandom()*56,size,size*.65);}for(let i=0;i<9;i++){const x=soilRandom()*56,y=soilRandom()*56;g.fillStyle='#594631';g.beginPath();g.ellipse(x,y,1+soilRandom()*2,.7+soilRandom()*1.3,soilRandom()*3,0,Math.PI*2);g.fill();}dirtTiles.push(tile);}blocks.forEach((block,i)=>{block.tile=i%dirtTiles.length;block.born=-1000;});function resolveCollision(){for(const block of blocks){const half=block.size/2,nearX=Math.max(block.x-half,Math.min(player.x,block.x+half)),nearY=Math.max(block.y-half,Math.min(player.y,block.y+half)),vx=player.x-nearX,vy=player.y-nearY,distance=Math.hypot(vx,vy);if(distance>0&&distance<14){const push=14-distance;player.x+=vx/distance*push;player.y+=vy/distance*push;}}}function movePlayer(mx,my){const count=Math.max(1,Math.ceil(Math.hypot(mx,my)/4));for(let i=0;i<count;i++){player.x+=mx/count;resolveCollision();player.y+=my/count;resolveCollision();}}const stoneCanvas=document.createElement('canvas');stoneCanvas.width=stoneCanvas.height=112;const stone=stoneCanvas.getContext('2d');stone.fillStyle='#777b79';stone.fillRect(0,0,112,112);for(let i=0;i<1900;i++){stone.fillStyle=['#656a68','#858986','#727875','#979b94'][Math.floor(soilRandom()*4)];stone.fillRect(soilRandom()*112,soilRandom()*112,1+soilRandom()*3,1+soilRandom()*2);}stone.strokeStyle='#4e56535c';stone.lineWidth=1;for(let i=0;i<12;i++){let x=soilRandom()*112,y=soilRandom()*112;stone.beginPath();stone.moveTo(x,y);for(let j=0;j<4;j++){x+=soilRandom()*16-8;y+=soilRandom()*12;stone.lineTo(x,y);}stone.stroke();}const stonePattern=ctx.createPattern(stoneCanvas,'repeat');const zoom=1.6;let w=0,h=0,last=0;function resize(){w=innerWidth/zoom;h=innerHeight/zoom;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);ctx.setTransform(d*zoom,0,0,d*zoom,0,0);}addEventListener('resize',resize);resize();const codes=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight'];addEventListener('keydown',e=>{if(codes.includes(e.code)){e.preventDefault();keys.add(e.code);}});addEventListener('keyup',e=>keys.delete(e.code));function clear(){keys.clear();last=0;}addEventListener('blur',clear);document.addEventListener('visibilitychange',clear);canvas.addEventListener('pointerdown',event=>{canvas.focus();if(event.button!==0)return;const rect=canvas.getBoundingClientRect(),worldX=(event.clientX-rect.left)*w/rect.width-w/2+camera.x,worldY=(event.clientY-rect.top)*h/rect.height-h/2+camera.y,gx=Math.floor((worldX+14)/28),gy=Math.floor((worldY+14)/28),key=cellKey(gx,gy),block=blockMap.get(key);if(!block||block.breakAt!==undefined)return;block.breakAt=performance.now();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])addBlock(gx+dx,gy+dy);});function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}function frame(now){requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.05):0;last=now;for(let i=blocks.length-1;i>=0;i--){const block=blocks[i];if(block.breakAt===undefined||now-block.breakAt<260)continue;const key=cellKey(block.gx,block.gy);blockMap.delete(key);blocks.splice(i,1);openCells.add(key);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])addBlock(block.gx+dx,block.gy+dy);for(let j=0;j<7;j++)brokenPieces.push({x:block.x,y:block.y,vx:(soilRandom()-.5)*65,vy:(soilRandom()-.5)*65,at:now,size:2+soilRandom()*3});}let dx=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),dy=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));const length=Math.hypot(dx,dy);player.moving=length>0;if(length){dx/=length;dy/=length;movePlayer(dx*190*dt,dy*190*dt);const target=Math.atan2(dy,dx)+Math.PI/2,delta=Math.atan2(Math.sin(target-player.angle),Math.cos(target-player.angle));player.angle+=delta*(1-Math.exp(-20*dt));player.phase+=dt*13;}const follow=1-Math.exp(-7*dt);camera.x+=(player.x-camera.x)*follow;camera.y+=(player.y-camera.y)*follow;const ox=w/2-camera.x,oy=h/2-camera.y;ctx.fillStyle='#757b77';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(ox,oy);ctx.fillStyle=stonePattern;ctx.fillRect(-ox,-oy,w,h);ctx.restore();ctx.save();ctx.beginPath();ctx.rect(0,0,w,h);for(const key of openCells){const[gx,gy]=key.split(',').map(Number),left=ox+gx*28-14,top=oy+gy*28-14;if(left+28<0||top+28<0||left>w||top>h)continue;ctx.rect(left,top,28,28);}ctx.fillStyle='#171819';ctx.fill('evenodd');ctx.restore();for(const block of blocks){const bx=ox+block.x,by=oy+block.y,progress=block.breakAt===undefined?0:Math.min(1,(now-block.breakAt)/260),ease=progress*progress*(3-2*progress),born=Math.max(0,Math.min(1,(now-block.born)/260)),appear=born*born*(3-2*born),k=block.size;ctx.save();ctx.imageSmoothingEnabled=false;if(progress>0){ctx.save();ctx.beginPath();ctx.rect(bx-14,by-14,28,28);ctx.clip();ctx.translate(ox,oy);ctx.fillStyle=stonePattern;ctx.fillRect(block.x-14,block.y-14,28,28);ctx.restore();ctx.globalAlpha=1-ease;for(let sy=0;sy<2;sy++)for(let sx=0;sx<2;sx++){const shift=ease*5,tx=bx-14+sx*14+(sx?1:-1)*shift,ty=by-14+sy*14+(sy?1:-1)*shift;ctx.drawImage(dirtTiles[block.tile],sx*28,sy*28,28,28,tx,ty,14,14);}ctx.globalAlpha=(1-ease)*Math.min(1,progress*5);ctx.strokeStyle='#35271b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bx-6,by-13);ctx.lineTo(bx+2,by-3);ctx.lineTo(bx-4,by+5);ctx.lineTo(bx+5,by+13);ctx.moveTo(bx+2,by-3);ctx.lineTo(bx+13,by-6);ctx.stroke();}else{ctx.globalAlpha=appear;ctx.drawImage(dirtTiles[block.tile],bx-14,by-14,k,k);ctx.fillStyle='#c49b6733';ctx.fillRect(bx-14,by-14,k,1);ctx.fillStyle='#32221955';ctx.fillRect(bx-14,by+12,k,2);ctx.strokeStyle='#513a293b';ctx.lineWidth=1;ctx.strokeRect(bx-13.5,by-13.5,k-1,k-1);}ctx.restore();}for(let i=brokenPieces.length-1;i>=0;i--){const bit=brokenPieces[i],age=(now-bit.at)/1000;if(age>.45){brokenPieces.splice(i,1);continue;}ctx.globalAlpha=1-age/.45;ctx.fillStyle='#6b4d33';ctx.fillRect(ox+bit.x+bit.vx*age,oy+bit.y+bit.vy*age,bit.size,bit.size);}ctx.globalAlpha=1; const px=player.x+ox,py=player.y+oy,step=player.moving?Math.sin(player.phase)*5:0;ellipse(px+2,py+8,19,12,'#1c342323');ctx.save();ctx.translate(px,py);ctx.rotate(player.angle);ellipse(0,0,14,14,'#477f61');ctx.restore();}window.gamePlayer=player;requestAnimationFrame(frame);})();</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вид сверху</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eff1ee;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}.hint{position:fixed;left:24px;bottom:24px;color:#626d67;font-size:13px;pointer-events:none;background:#ffffffd9;padding:12px 16px;border:1px solid #dce1da;border-radius:12px}kbd{font:600 12px system-ui;display:inline-block;padding:3px 6px;margin:0 2px;background:white;border:1px solid #dce1da;border-radius:4px;color:#293e34}.label{position:fixed;top:24px;left:26px;font-size:11px;letter-spacing:2px;color:#819087;pointer-events:none}</style></head><body><canvas id="game" tabindex="0" aria-label="Игровое поле. Ходьба на WASD или стрелках."></canvas><div class="label">ВИД СВЕРХУ / 2D</div><div class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — ходьба <span style="opacity:.55">· или стрелки</span></div><script>(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),keys=new Set(),player={x:0,y:0,angle:0,phase:0,moving:false},camera={x:0,y:0};let w=0,h=0,last=0;function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);}addEventListener('resize',resize);resize();const codes=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight'];addEventListener('keydown',e=>{if(codes.includes(e.code)){e.preventDefault();keys.add(e.code);}});addEventListener('keyup',e=>keys.delete(e.code));function clear(){keys.clear();last=0;}addEventListener('blur',clear);document.addEventListener('visibilitychange',clear);canvas.addEventListener('pointerdown',()=>canvas.focus());function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}function frame(now){requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.05):0;last=now;let dx=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),dy=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));const length=Math.hypot(dx,dy);player.moving=length>0;if(length){dx/=length;dy/=length;player.x+=dx*190*dt;player.y+=dy*190*dt;const target=Math.atan2(dy,dx)+Math.PI/2,delta=Math.atan2(Math.sin(target-player.angle),Math.cos(target-player.angle));player.angle+=delta*(1-Math.exp(-20*dt));player.phase+=dt*13;}const follow=1-Math.exp(-7*dt);camera.x+=(player.x-camera.x)*follow;camera.y+=(player.y-camera.y)*follow;ctx.fillStyle='#eff1ee';ctx.fillRect(0,0,w,h);const ox=w/2-camera.x,oy=h/2-camera.y,grid=64;ctx.strokeStyle='#e1e6df';ctx.lineWidth=1;ctx.beginPath();for(let x=((ox%grid)+grid)%grid;x<w;x+=grid){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,h);}for(let y=((oy%grid)+grid)%grid;y<h;y+=grid){ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(w,Math.round(y)+.5);}ctx.stroke();ctx.strokeStyle='#c8d3c9';ctx.beginPath();ctx.arc(ox,oy,6,0,Math.PI*2);ctx.stroke();const px=player.x+ox,py=player.y+oy,step=player.moving?Math.sin(player.phase)*5:0;ellipse(px+2,py+8,19,12,'#1c342323');ctx.save();ctx.translate(px,py);ctx.rotate(player.angle);function panel(x,y,width,height,fill,edge='#394b55'){ctx.fillStyle=fill;ctx.fillRect(x,y,width,height);ctx.strokeStyle=edge;ctx.lineWidth=1.5;ctx.strokeRect(x+.5,y+.5,width-1,height-1);}panel(-13,step,10,15,'#394b55');panel(3,-step,10,15,'#394b55');for(const side of[-1,1]){panel(side<0?-22:15,-7-step*side*.4,7,15,'#899da7');ellipse(side*14,0,4,4,'#354751');panel(side<0?-22:16,6-step*side*.4,6,5,'#455b66');}panel(-14,-8,28,23,'#9aadb5');panel(-10,5,20,7,'#718892');for(let i=0;i<4;i++)panel(-6+i*4,7,2,3,'#354b55','#354b55');panel(-11,-15,22,18,'#c0cdd1');panel(-8,-13,16,6,'#233c49');ctx.fillStyle='#64e1ed';ctx.fillRect(-6,-12,4,3);ctx.fillRect(2,-12,4,3);ctx.fillStyle='#627e8b';ctx.fillRect(-6,-4,12,2);ctx.strokeStyle='#526b77';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(7,-15);ctx.lineTo(9,-22);ctx.stroke();ellipse(9,-22,2.5,2.5,'#63d8e2');for(const x of[-11,11])ellipse(x,2,1.5,1.5,'#405a65');ctx.restore();}window.gamePlayer=player;requestAnimationFrame(frame);})();</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

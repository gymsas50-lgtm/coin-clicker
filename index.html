<script>(()=>{const known=new Map(),overlay=document.querySelector('.index-overlay'),open=document.querySelector('.index-open'),close=document.querySelector('.index-close');let focus=null;window.registerSlime=el=>{if(!known.has(el.dataset.kind)){const svg=el.querySelector('svg').cloneNode(true);svg.removeAttribute('style');known.set(el.dataset.kind,svg.outerHTML);}if(!overlay.hidden)render();};function render(){document.querySelector('.index-count').textContent='Открыто '+known.size+' / '+slimeTypes.length;const grid=document.querySelector('.index-grid');grid.replaceChildren();for(const t of slimeTypes){const card=document.createElement('div');card.className='index-card';if(known.has(t[0])){card.style.borderColor=rarityColor(t[2])+'66';card.innerHTML=known.get(t[0])+'<div>'+t[1]+'</div><small style="color:'+rarityColor(t[2])+'">'+t[2]+'</small>';}else{card.innerHTML='<div class="question">?</div><div>Не открыт</div><small>???</small>';}grid.append(card);}}function hide(){overlay.hidden=true;focus?.focus();}open.onclick=()=>{focus=document.activeElement;render();overlay.hidden=false;close.focus();};close.onclick=hide;for(const el of[open,close])el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}};overlay.addEventListener('pointerdown',e=>{if(e.target===overlay)hide();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)hide();if(e.key==='Tab'&&!overlay.hidden){e.preventDefault();close.focus();}});window.plortBurst=el=>{const r=el.getBoundingClientRect(),color=el.dataset.kind?slimeType(el.dataset.kind)[4]:100;for(let i=0;i<10;i++){const bit=document.createElement('i'),size=2+Math.random()*4,a=Math.random()*Math.PI*2,d=12+Math.random()*23;bit.style.cssText='position:fixed;pointer-events:none;z-index:1600;left:'+(r.left+r.width/2)+'px;top:'+(r.top+r.height/2)+'px;width:'+size+'px;height:'+size+'px;background:hsl('+color+' 35% 70%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)';document.body.append(bit);bit.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+10)+'px) rotate(180deg)',opacity:0}],{duration:350+Math.random()*200,easing:'ease-out',fill:'forwards'});setTimeout(()=>bit.remove(),600);}};})();</script>
<style>.slime svg{filter:drop-shadow(.8px 0 0 var(--rarity-color,#fff)) drop-shadow(-.8px 0 0 var(--rarity-color,#fff)) drop-shadow(0 .8px 0 var(--rarity-color,#fff)) drop-shadow(0 -.8px 0 var(--rarity-color,#fff))}.slime.inspected svg{filter:drop-shadow(1.3px 0 0 var(--rarity-color,#fff)) drop-shadow(-1.3px 0 0 var(--rarity-color,#fff)) drop-shadow(0 1.3px 0 var(--rarity-color,#fff)) drop-shadow(0 -1.3px 0 var(--rarity-color,#fff)) drop-shadow(0 0 7px var(--rarity-color,#fff))}.slime.dragging svg{filter:drop-shadow(1px 0 0 var(--rarity-color,#fff)) drop-shadow(-1px 0 0 var(--rarity-color,#fff)) drop-shadow(0 1px 0 var(--rarity-color,#fff)) drop-shadow(0 -1px 0 var(--rarity-color,#fff)) drop-shadow(0 10px 5px #17392f55)}.flying-slime svg{filter:drop-shadow(1px 0 0 var(--rarity-color,#fff)) drop-shadow(-1px 0 0 var(--rarity-color,#fff)) drop-shadow(0 1px 0 var(--rarity-color,#fff)) drop-shadow(0 -1px 0 var(--rarity-color,#fff))}</style><script>new MutationObserver(records=>{for(const record of records)for(const el of record.addedNodes)if(el.nodeType===1&&el.classList?.contains('flying-slime'))el.style.setProperty('--rarity-color',rarityColor(slimeType(el.dataset.kind)[2]));}).observe(document.body,{childList:true});</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мессенджер — вход</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#20252d;font:15px system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{background:white;width:100%;max-width:420px;padding:36px;border:1px solid #e7e9ef;border-radius:22px;box-shadow:0 16px 60px #24355409}.icon{width:48px;height:48px;border-radius:16px;background:#eaf1ff;color:#3568db;display:grid;place-items:center;font-size:26px}h1{font-size:26px;letter-spacing:-1px;margin:22px 0 8px}.muted{color:#7c8492;line-height:1.6;margin:0 0 24px}label{display:block;font-size:13px;font-weight:600;margin:18px 0 8px}input{width:100%;border:1px solid #dce0e8;border-radius:10px;padding:13px;font:inherit;outline:none}input:focus{border-color:#4f7ee5;box-shadow:0 0 0 3px #eef3ff}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:13px;width:100%;background:#3169df;color:white;margin-top:22px;font-weight:600}button:disabled{opacity:.6;cursor:wait}.switch{background:none;color:#3866bc;margin-top:8px;font-size:13px}.hint{font-size:12px;color:#858d9a;margin:7px 0}.error{color:#b33440;line-height:1.5;font-size:13px;min-height:20px;margin-top:14px}[hidden]{display:none!important}.tag{display:inline-block;color:#39705d;background:#edf7f1;border-radius:20px;padding:5px 10px;font-size:12px;margin-top:12px}</style></head><body><main class="card"><div class="icon" aria-hidden="true">◧</div><section id="auth"><h1 id="title">Создать аккаунт</h1><p class="muted" id="subtitle">Ваш первый шаг в мессенджере.</p><form id="form"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required spellcheck="false" placeholder="Например, alex"><p class="hint">3–32 буквы, цифры или знак _</p><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="Не менее 10 символов"><div id="confirmWrap"><label for="confirm">Повторите пароль</label><input id="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div><p id="error" class="error" role="status" aria-live="polite"></p><button id="submit" type="submit">Зарегистрироваться</button></form><button id="switch" class="switch">Уже есть аккаунт? Войти</button></section><section id="account" hidden><h1 id="welcome"></h1><span class="tag">Вы вошли в аккаунт</span><p class="muted" style="margin-top:20px">Аккаунт готов. Чаты появятся здесь чуть позже.</p><button id="logout" class="switch">Выйти</button><p id="accountError" class="error" role="status"></p></section></main><script>let register=true,busy=false;const $=id=>document.getElementById(id);async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const result=await r.json();if(!r.ok)throw Error(result.error||'Не удалось выполнить запрос.');return result;}function show(user){$('auth').hidden=!!user;$('account').hidden=!user;if(user){$('welcome').textContent='Привет, '+user.username+'!';$('form').reset();}}$('switch').onclick=()=>{if(busy)return;register=!register;$('title').textContent=register?'Создать аккаунт':'С возвращением';$('subtitle').textContent=register?'Ваш первый шаг в мессенджере.':'Войдите, чтобы продолжить.';$('confirmWrap').hidden=!register;$('confirm').required=register;$('password').autocomplete=register?'new-password':'current-password';$('submit').textContent=register?'Зарегистрироваться':'Войти';$('switch').textContent=register?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться';$('error').textContent='';};$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;$('error').textContent='';if(register&&$('password').value!==$('confirm').value){$('error').textContent='Пароли не совпадают.';return;}busy=true;$('submit').disabled=true;try{const data=await api(register?'/api/register':'/api/login',{username:$('username').value,password:$('password').value});show(data.user);}catch(e){$('error').textContent=e.message;}finally{busy=false;$('submit').disabled=false;}};$('logout').onclick=async()=>{try{await api('/api/logout',{});show(null);}catch(e){$('accountError').textContent=e.message;}};api('/api/me').then(d=>show(d.user)).catch(e=>$('error').textContent=e.message);</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-id" content="arena-coin-clicker"><title>Тихая поляна</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#8ba779;font-family:Arial,sans-serif;color:#f4f4e8}canvas{display:block;touch-action:none}header{position:fixed;top:22px;left:24px;background:#263e35e8;padding:17px 22px;border-radius:12px;box-shadow:0 5px 25px #213c3220;pointer-events:none}.tag{font-size:9px;letter-spacing:3px;color:#b6c8aa}h1{font-size:22px;font-weight:500;margin:7px 0 5px}p{font-size:11px;color:#c5d1be;margin:0;line-height:1.8}footer{position:fixed;bottom:20px;right:24px;background:#263e35db;padding:10px 14px;border-radius:9px;font-size:11px;letter-spacing:1px;pointer-events:none}#pad{display:none;position:fixed;bottom:25px;left:25px;grid-template-columns:repeat(3,48px);gap:5px}button{height:48px;background:#263e35c9;color:white;border:1px solid #fff4;border-radius:9px;font-size:20px;touch-action:none;user-select:none}@media(pointer:coarse){#pad{display:grid}header{top:12px;left:12px;padding:12px 16px}}</style></head><body><canvas></canvas><header><div class="tag">2D / TOP DOWN</div><h1>Тихая поляна</h1><p>WASD или стрелки — ходить<br>R — вернуться на поляну</p></header><footer>КООРДИНАТЫ <span id="coords">0 / 70</span></footer><div id="pad"><span></span><button data-key="KeyW">↑</button><span></span><button data-key="KeyA">←</button><button data-key="KeyS">↓</button><button data-key="KeyD">→</button></div><script>(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),keys=new Set(),player={x:0,y:70,r:12},camera={x:0,y:70},world={w:2400,h:1800};let width=0,height=0,last=0,walk=0,facing=0;const trees=[],rocks=[];let seed=12345;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}for(let i=0;i<155;i++){const x=rand()*2260-1130,y=rand()*1660-830;if(Math.abs(x)<115||Math.abs(y)<80||Math.hypot(x,y-70)<180)continue;trees.push({x,y,r:25+rand()*15,tone:rand()});}for(let i=0;i<32;i++){const x=rand()*2160-1080,y=rand()*1560-780;if(Math.abs(x)<130||Math.abs(y)<90)continue;rocks.push({x,y,r:14+rand()*10});}const obstacles=[...trees.map(t=>({x:t.x,y:t.y,r:15})),...rocks];function reset(){player.x=0;player.y=70;camera.x=0;camera.y=70;}const codes=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight','KeyR'];addEventListener('keydown',e=>{if(codes.includes(e.code)){e.preventDefault();keys.add(e.code);if(e.code==='KeyR')reset();}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>{keys.clear();last=0;});document.querySelectorAll('[data-key]').forEach(button=>{const clear=()=>keys.delete(button.dataset.key);button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys.add(button.dataset.key);});for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,clear);});function resize(){width=innerWidth;height=innerHeight;const ratio=Math.min(devicePixelRatio||1,2);canvas.width=width*ratio;canvas.height=height*ratio;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(ratio,0,0,ratio,0,0);}addEventListener('resize',resize);resize();function update(dt){let x=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),y=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));const length=Math.hypot(x,y);if(length){x/=length;y/=length;player.x+=x*190*dt;player.y+=y*190*dt;facing=Math.atan2(y,x);walk+=dt*12;}for(let pass=0;pass<3;pass++)for(const o of obstacles){let dx=player.x-o.x,dy=player.y-o.y,d=Math.hypot(dx,dy),min=player.r+o.r;if(d<min){if(d<.0001){dx=1;dy=0;d=1;}player.x=o.x+dx/d*min;player.y=o.y+dy/d*min;}}player.x=Math.max(-1180,Math.min(1180,player.x));player.y=Math.max(-880,Math.min(880,player.y));camera.x+=(player.x-camera.x)*(1-Math.exp(-dt*9));camera.y+=(player.y-camera.y)*(1-Math.exp(-dt*9));document.getElementById('coords').textContent=Math.round(player.x)+' / '+Math.round(player.y);}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}function drawPlayer(){ellipse(player.x+3,player.y+7,13,8,'#183f343b');ellipse(player.x,player.y,player.r,player.r,'#447bce');ellipse(player.x-3,player.y-4,3,3,'#ffffff35');}function drawTree(t){ellipse(t.x+7,t.y+9,t.r+6,t.r*.72,'#203e322e');ctx.fillStyle='#74553e';ctx.fillRect(t.x-6,t.y-5,12,23);ellipse(t.x,t.y-9,t.r,t.r*.88,t.tone>.5?'#3c7256':'#447c58');ellipse(t.x-9,t.y-16,t.r*.64,t.r*.61,'#528864');ellipse(t.x+9,t.y-9,t.r*.57,t.r*.59,'#477b57');ellipse(t.x-9,t.y-21,t.r*.34,t.r*.28,'#659b70');}const grass=[];for(let i=0;i<2300;i++)grass.push({x:rand()*2400-1200,y:rand()*1800-900,v:rand()});function draw(){ctx.fillStyle='#263f35';ctx.fillRect(0,0,width,height);ctx.save();ctx.translate(width/2-camera.x,height/2-camera.y);ctx.fillStyle='#8ba779';ctx.fillRect(-1200,-900,2400,1800);ctx.fillStyle='#baa98a';ctx.fillRect(-1200,-35,2400,70);ctx.fillRect(-38,-900,76,1800);ctx.fillStyle='#c7b797';ctx.fillRect(-1200,-25,2400,50);ctx.fillRect(-27,-900,54,1800);ctx.strokeStyle='#749567';ctx.lineWidth=1;for(const g of grass){if(Math.abs(g.x)<45||Math.abs(g.y)<42||Math.abs(g.x-camera.x)>width/2+20||Math.abs(g.y-camera.y)>height/2+20)continue;ctx.beginPath();ctx.moveTo(g.x-2,g.y+3);ctx.lineTo(g.x,g.y-2);ctx.lineTo(g.x+2,g.y+3);ctx.stroke();}ctx.strokeStyle='#e4d4b25c';ctx.lineWidth=5;ctx.strokeRect(-1198,-898,2396,1796);for(const r of rocks){ellipse(r.x+4,r.y+6,r.r,r.r*.65,'#263c332e');ellipse(r.x,r.y,r.r,r.r*.77,'#7d8b85');ellipse(r.x-3,r.y-4,r.r*.75,r.r*.47,'#a9b0a0');}const ordered=[...trees,{y:player.y+8,player:true}].sort((a,b)=>a.y-b.y);for(const object of ordered){if(object.player)drawPlayer();else if(Math.abs(object.x-camera.x)<width/2+80&&Math.abs(object.y-camera.y)<height/2+80)drawTree(object);}ctx.restore();}function frame(now){requestAnimationFrame(frame);const dt=last?Math.min(.04,(now-last)/1000):0;last=now;update(dt);draw();}window.topdownGame={player,camera,keys,update,reset,obstacles};requestAnimationFrame(frame);})();</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

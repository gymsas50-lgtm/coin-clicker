d?h*.78-16:Math.min(ship.y+(h-oldH)*.78,h*.78-16);ship.previousY=ship.y;ship.previousAngle=ship.angle;accumulator=0;trail.length=0;}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump();keyboard=true;}});addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))keyboard=false;});canvas.addEventListener('pointerdown',e=>{jump();pointer=true;canvas.focus();canvas.setPointerCapture(e.pointerId);});for(const event of['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>pointer=false);function jump(){jumpBuffer=.12;}function simulate(dt){if(respawnDelay>0){respawnDelay-=dt;if(respawnDelay<=0)resetRun();return;}ship.previousY=ship.y;ship.previousAngle=ship.angle;const floor=h*.78-16,cycle=Math.floor(distance/levelLength),solids=[];for(const repeat of[cycle-1,cycle,cycle+1])for(const p of platforms){const left=p.at+repeat*levelLength-distance;solids.push({left,right:left+p.width,top:h*.78-p.height});}let support=floor;for(const p of solids)if(p.left<15&&p.right>-15&&Math.abs(ship.y+16-p.top)<1.5)support=Math.min(support,p.top-16);if(ship.grounded&&Math.abs(ship.y-support)>2){ship.grounded=false;ship.jumpAge=0;ship.startAngle=ship.angle;}if(ship.grounded&&(jumpBuffer>0||keyboard||pointer)){ship.grounded=false;ship.vy=-jumpSpeed;ship.jumpAge=0;ship.startAngle=ship.angle;jumpBuffer=0;}jumpBuffer=Math.max(0,jumpBuffer-dt);distance+=250*dt;for(const p of solids){p.left-=250*dt;p.right-=250*dt;}if(!ship.grounded){ship.jumpAge+=dt;ship.y+=ship.vy*dt+gravity*dt*dt*.5;ship.vy+=gravity*dt;ship.angle+=Math.PI/flightTime*dt;let landing=floor;for(const p of solids)if(p.left<15&&p.right>-15&&ship.previousY+16<=p.top+.5&&ship.y+16>=p.top&&ship.vy>=0)landing=Math.min(landing,p.top-16);if(ship.y>=landing&&ship.vy>=0){ship.y=landing;ship.vy=0;ship.grounded=true;}}else{ship.y=support;ship.vy=0;}if(ship.grounded){const target=Math.round(ship.angle/(Math.PI/2))*(Math.PI/2);ship.angle+=(target-ship.angle)*(1-Math.exp(-35*dt));}for(const p of solids)if(p.left<14&&p.right>-14&&ship.y+15>p.top+1&&ship.y-15<h*.78){respawnDelay=.35;keyboard=pointer=false;return;}const cubeX=w*.29;for(const group of spikeGroups){const currentCycle=Math.floor(distance/levelLength);for(const repeat of[currentCycle-1,currentCycle,currentCycle+1])for(let i=0;i<group.count;i++){const sx=cubeX+group.at+repeat*levelLength+i*28-distance;if(sx+26<cubeX-13||sx>cubeX+13)continue;const overlapLeft=Math.max(cubeX-12,sx+3),overlapRight=Math.min(cubeX+12,sx+25);if(overlapLeft>overlapRight)continue;const sample=Math.max(overlapLeft,Math.min(sx+14,overlapRight)),height=30*(1-Math.abs(sample-(sx+14))/14);if(ship.y+12>h*.78-height+3){respawnDelay=.35;keyboard=pointer=false;return;}}}}

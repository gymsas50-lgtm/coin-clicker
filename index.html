<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-id" content="arena-coin-clicker"><title>Тихая поляна</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#8ba779;font-family:Arial,sans-serif;color:#f4f4e8}canvas{display:block;touch-action:none}header{position:fixed;top:22px;left:24px;background:#263e35e8;padding:17px 22px;border-radius:12px;box-shadow:0 5px 25px #213c3220;pointer-events:none}.tag{font-size:9px;letter-spacing:3px;color:#b6c8aa}h1{font-size:22px;font-weight:500;margin:7px 0 5px}p{font-size:11px;color:#c5d1be;margin:0;line-height:1.8}footer{position:fixed;bottom:20px;right:24px;background:#263e35db;padding:10px 14px;border-radius:9px;font-size:11px;letter-spacing:1px;pointer-events:none}#pad{display:none;position:fixed;bottom:25px;left:25px;grid-template-columns:repeat(3,48px);gap:5px}button{height:48px;background:#263e35c9;color:white;border:1px solid #fff4;border-radius:9px;font-size:20px;touch-action:none;user-select:none}@media(pointer:coarse){#pad{display:grid}header{top:12px;left:12px;padding:12px 16px}}</style></head><body><canvas></canvas><header><div class="tag">2D / TOP DOWN</div><h1>Тихая поляна</h1><p>WASD или стрелки — ходить<br>R — вернуться на поляну</p></header><footer>КООРДИНАТЫ <span id="coords">0 / 70</span></footer><div id="pad"><span></span><button data-key="KeyW">↑</button><span></span><button data-key="KeyA">←</button><button data-key="KeyS">↓</button><button data-key="KeyD">→</button></div><script>(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),keys=new Set(),player={x:0,y:70,r:12},camera={x:0,y:70},world={w:9600,h:7200},zoom=.65;let width=0,height=0,last=0,walk=0,facing=0;const trees=[],rocks=[];let seed=12345;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}for(let i=0;i<1800;i++){const x=rand()*9460-4730,y=rand()*7060-3530;if(Math.abs(x)<115||Math.abs(y)<80||Math.hypot(x,y-70)<180)continue;trees.push({x,y,r:25+rand()*15,tone:rand()});}for(let i=0;i<360;i++){const x=rand()*9360-4680,y=rand()*6960-3480;if(Math.abs(x)<130||Math.abs(y)<90)continue;rocks.push({x,y,r:14+rand()*10});}const spider={x:0,y:115,r:3,scale:.4,speed:125,angle:-Math.PI/2,gait:0},trail=[{x:0,y:70}];const obstacles=[...trees.map(t=>({x:t.x,y:t.y,r:15})),...rocks];function reset(){spider.x=0;spider.y=115;spider.angle=-Math.PI/2;spider.gait=0;spider.scale=.4;spider.speed=125;spider.r=3;trail.length=0;trail.push({x:0,y:70});player.x=0;player.y=70;camera.x=0;camera.y=70;}const codes=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight','KeyR'];addEventListener('keydown',e=>{if(codes.includes(e.code)){e.preventDefault();keys.add(e.code);if(e.code==='KeyR')reset();}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>{keys.clear();last=0;});document.querySelectorAll('[data-key]').forEach(button=>{const clear=()=>keys.delete(button.dataset.key);button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys.add(button.dataset.key);});for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,clear);});function resize(){width=innerWidth;height=innerHeight;const ratio=Math.min(devicePixelRatio||1,2);canvas.width=width*ratio;canvas.height=height*ratio;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(ratio,0,0,ratio,0,0);}addEventListener('resize',resize);resize();function update(dt){let x=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),y=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));const length=Math.hypot(x,y);if(length){x/=length;y/=length;player.x+=x*190*dt;player.y+=y*190*dt;facing=Math.atan2(y,x);walk+=dt*12;}for(let pass=0;pass<3;pass++)for(const o of obstacles){let dx=player.x-o.x,dy=player.y-o.y,d=Math.hypot(dx,dy),min=player.r+o.r;if(d<min){if(d<.0001){dx=1;dy=0;d=1;}player.x=o.x+dx/d*min;player.y=o.y+dy/d*min;}}player.x=Math.max(-4780,Math.min(4780,player.x));player.y=Math.max(-3580,Math.min(3580,player.y));updateSpider(dt);camera.x+=(player.x-camera.x)*(1-Math.exp(-dt*9));camera.y+=(player.y-camera.y)*(1-Math.exp(-dt*9));document.getElementById('coords').textContent=Math.round(player.x)+' / '+Math.round(player.y);}function updateSpider(dt){spider.clock=(spider.clock||0)+dt;const tail=trail[trail.length-1];if(!tail||Math.hypot(player.x-tail.x,player.y-tail.y)>7)trail.push({x:player.x,y:player.y});if(trail.length>1200)trail.splice(0,trail.length-1200);const distanceToPlayer=Math.hypot(player.x-spider.x,player.y-spider.y);const distanceFactor=Math.max(0,distanceToPlayer-40)/220;const targetScale=Math.min(65,.4+Math.pow(distanceFactor,1.45)*1.4);spider.scale+=(targetScale-spider.scale)*(1-Math.exp(-dt*(targetScale>spider.scale?4:.3)));spider.r=Math.min(10,7.5*spider.scale);spider.speed=Math.max(85,145/(1+distanceFactor*.16));if(distanceToPlayer<32&&trail.length<9)return;function clearPath(point){const dx=point.x-spider.x,dy=point.y-spider.y,lengthSq=dx*dx+dy*dy;for(const o of obstacles){const t=Math.max(0,Math.min(1,((o.x-spider.x)*dx+(o.y-spider.y)*dy)/(lengthSq||1)));if(Math.hypot(spider.x+dx*t-o.x,spider.y+dy*t-o.y)<o.r+spider.r+.5)return false;}return true;}for(let i=trail.length-1;i>0;i--)if(clearPath(trail[i])){trail.splice(0,i);break;}let budget=spider.speed*dt;while(budget>0&&trail.length){const target=trail[0],dx=target.x-spider.x,dy=target.y-spider.y,distance=Math.hypot(dx,dy);if(distance<1){trail.shift();continue;}const move=Math.min(distance,budget);spider.x+=dx/distance*move;spider.y+=dy/distance*move;const heading=Math.atan2(dy,dx),delta=Math.atan2(Math.sin(heading-spider.angle),Math.cos(heading-spider.angle));spider.angle+=delta*Math.min(1,dt*14);spider.gait+=move*.23;budget-=move;if(distance<=move+.01)trail.shift();else break;}for(let pass=0;pass<2;pass++)for(const o of obstacles){const dx=spider.x-o.x,dy=spider.y-o.y,d=Math.hypot(dx,dy),minimum=spider.r+o.r;if(d<minimum&&d>.001){spider.x=o.x+dx/d*minimum;spider.y=o.y+dy/d*minimum;}}}function drawSpider(){const t=spider.clock||0,breath=Math.sin(t*1.45)*.04,twitch=Math.pow(Math.max(0,Math.sin(t*2.7)),28)*Math.sin(t*61),look=Math.atan2(player.y-spider.y,player.x-spider.x)-spider.angle,headAngle=Math.atan2(Math.sin(look),Math.cos(look))*.25;ellipse(spider.x+spider.scale*2,spider.y+spider.scale*4,spider.scale*24,spider.scale*17,'#10201e65');ctx.save();ctx.translate(spider.x,spider.y);ctx.rotate(spider.angle+twitch*.025);ctx.scale(spider.scale,spider.scale);ctx.lineCap='round';function line(points,color,w){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.stroke();}function plate(points,fill,edge){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill();if(edge){ctx.strokeStyle=edge;ctx.lineWidth=.35;ctx.stroke();}}for(const side of [-1,1])for(let leg=0;leg<4;leg++){const phase=spider.gait*.65+leg*1.95+(side===1?2.2:0),cycle=((phase%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/(Math.PI*2),swing=cycle<.72?1-cycle/.72*2:-1+(cycle-.72)/.28*2,jerk=Math.pow(Math.max(0,Math.sin(t*3.1+leg*2+side)),22)*Math.sin(t*45+leg)*.9,along=(leg-1.5)*5,kx=along*1.8+swing*2,ky=side*(15+Math.abs(leg-1.5)*2+breath*8),fx=along*2.4+swing*4+jerk,fy=side*(26-Math.abs(leg-1.5)*2.5)+jerk;line([[along,side*3],[kx,ky],[fx,fy]],'#151c25',2.5);line([[along,side*3],[kx,ky]],leg%2?'#596367':'#424951',1.6);line([[kx,ky],[fx,fy]],'#70756d',.85);line([[along+1,side*3],[kx+2,ky],[fx+1,fy]],leg%2?'#71434a':'#786139',.45);ellipse(kx,ky,1.65,1.65,'#382c31');ellipse(kx,ky,1.05,1.05,'#ac7851');ellipse(kx-.25,ky-.3,.45,.45,'#a7b1ab');line([[fx,fy],[fx+2,fy+side*3.3],[fx-.3,fy+side*2.7]],'#22212b',1.1);const mx=(kx+fx)/2,my=(ky+fy)/2;plate([[mx-1,my],[mx+2.7,my+side*3.5],[mx+1,my-1]],'#46404b');}ctx.save();ctx.rotate(headAngle+twitch*.03);ctx.scale(1+breath,1-breath);plate([[-14,0],[10,-9],[8,0],[10,9]],'#171c25','#7d7971');ellipse(-2,0,6,4.5,'#4f2635');for(let i=0;i<6;i++){const x=-8+i*2.3,pulse=Math.sin(t*1.6-i*.7)*.25;line([[x,-3.1],[x+.8,-1],[x-.2,0],[x+.8,1],[x,3.1]],i%2?'#9b705d':'#65746d',.65+pulse*.3);}for(const side of [-1,1]){plate([[-13,0],[-5,side*5.7],[-1,side*2.7]],'#555e61','#93978b');plate([[-4,side*6],[8,side*8],[5,side*3.7],[-1,side*3]],side===1?'#454956':'#62665e','#989380');line([[-6,side*3],[0,side*4.1],[3,side*3]],'#7b3b40',.6);for(let i=0;i<3;i++)ellipse(-2+i*3,side*(4.5+i*.55),.38,.38,'#b19973');for(let i=0;i<3;i++)plate([[-7+i*4,side*5],[-6+i*4,side*(8+i*.3)],[-5+i*4,side*5.7]],'#252630','#72766b');const claw=Math.sin(t*1.7+side)*1.1;line([[7,side*2.8],[12+claw,side*4.4],[14,side*1.6],[11.4,side*.8]],'#34242e',2);line([[8,side*2.8],[12+claw,side*4.4],[14,side*1.6]],'#b2a18a',.8);line([[-9,side*2],[-16,side*(5+Math.sin(t*2+side))],[-19,side*(4+Math.sin(t*3+side))]],'#4f5556',.45);}plate([[1,-3.2],[8,-3.7],[10,0],[8,3.7],[1,3.2]],'#20232c','#5e555b');ctx.shadowColor='#ff1238';ctx.shadowBlur=12;for(const side of [-1,1]){ellipse(7,side*1.9,1.55,.65,'#ff1238');ellipse(3.8,side*2.3,.7,.7,'#e52746');ellipse(.9,side*3.1,.45,.45,'#ff5260');}ctx.shadowBlur=0;for(const side of [-1,1])ellipse(7.4,side*1.85,.4,.22,'#ffb3aa');ctx.restore();ctx.restore();}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}function drawPlayer(){ellipse(player.x+3,player.y+7,13,8,'#183f343b');ellipse(player.x,player.y,player.r,player.r,'#447bce');ellipse(player.x-3,player.y-4,3,3,'#ffffff35');}function drawTree(t){ellipse(t.x+7,t.y+9,t.r+6,t.r*.72,'#203e322e');ctx.fillStyle='#74553e';ctx.fillRect(t.x-6,t.y-5,12,23);ellipse(t.x,t.y-9,t.r,t.r*.88,t.tone>.5?'#3c7256':'#447c58');ellipse(t.x-9,t.y-16,t.r*.64,t.r*.61,'#528864');ellipse(t.x+9,t.y-9,t.r*.57,t.r*.59,'#477b57');ellipse(t.x-9,t.y-21,t.r*.34,t.r*.28,'#659b70');}const grass=[];for(let i=0;i<22000;i++)grass.push({x:rand()*9600-4800,y:rand()*7200-3600,v:rand()});function draw(){ctx.fillStyle='#263f35';ctx.fillRect(0,0,width,height);ctx.save();ctx.translate(width/2,height/2);ctx.scale(zoom,zoom);ctx.translate(-camera.x,-camera.y);ctx.fillStyle='#8ba779';ctx.fillRect(-4800,-3600,9600,7200);ctx.fillStyle='#baa98a';ctx.fillRect(-4800,-35,9600,70);ctx.fillRect(-38,-3600,76,7200);ctx.fillStyle='#c7b797';ctx.fillRect(-4800,-25,9600,50);ctx.fillRect(-27,-3600,54,7200);ctx.strokeStyle='#749567';ctx.lineWidth=1;for(const g of grass){if(Math.abs(g.x)<45||Math.abs(g.y)<42||Math.abs(g.x-camera.x)>width/(2*zoom)+20||Math.abs(g.y-camera.y)>height/(2*zoom)+20)continue;ctx.beginPath();ctx.moveTo(g.x-2,g.y+3);ctx.lineTo(g.x,g.y-2);ctx.lineTo(g.x+2,g.y+3);ctx.stroke();}ctx.strokeStyle='#e4d4b25c';ctx.lineWidth=5;ctx.strokeRect(-4798,-3598,9596,7196);for(const r of rocks){if(Math.abs(r.x-camera.x)>width/(2*zoom)+40||Math.abs(r.y-camera.y)>height/(2*zoom)+40)continue;ellipse(r.x+4,r.y+6,r.r,r.r*.65,'#263c332e');ellipse(r.x,r.y,r.r,r.r*.77,'#7d8b85');ellipse(r.x-3,r.y-4,r.r*.75,r.r*.47,'#a9b0a0');}const ordered=[...trees,{y:spider.y+6,spider:true},{y:player.y+8,player:true}].sort((a,b)=>a.y-b.y);for(const object of ordered){if(object.player)drawPlayer();else if(object.spider)drawSpider();else if(Math.abs(object.x-camera.x)<width/(2*zoom)+80&&Math.abs(object.y-camera.y)<height/(2*zoom)+80)drawTree(object);}ctx.restore();}function frame(now){requestAnimationFrame(frame);const dt=last?Math.min(.04,(now-last)/1000):0;last=now;update(dt);draw();}window.topdownGame={player,spider,trail,camera,keys,update,reset,obstacles};requestAnimationFrame(frame);})();</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

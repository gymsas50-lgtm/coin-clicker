<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кубик</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060e25;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}.hint{position:fixed;left:28px;bottom:22px;color:#91a9c4;font-size:12px;letter-spacing:.5px;pointer-events:none}</style></head><body><canvas id="flight" tabindex="0" aria-label="Кубик. Пробел или клик — прыжок."></canvas><div class="hint">ПРОБЕЛ / КЛИК — ПРЫЖОК · УДЕРЖИВАЙ ДЛЯ ПОВТОРА</div><script>(()=>{'use strict';const canvas=document.getElementById('flight'),ctx=canvas.getContext('2d');let w=0,h=0,last=0,time=0,distance=0,keyboard=false,pointer=false;const ship={y:0,vy:0,angle:0,grounded:true,previousY:0,previousAngle:0,jumpAge:0,startAngle:0},trail=[],sparks=[];const gravity=2000,jumpSpeed=600,flightTime=2*jumpSpeed/gravity,step=1/120;const spikeGroups=[{at:600,count:1},{at:1020,count:2},{at:1460,count:3},{at:1920,count:4}],levelLength=2520;let respawnDelay=0;function resetRun(){distance=0;ship.y=h*.78-16;ship.vy=0;ship.angle=0;ship.previousY=ship.y;ship.previousAngle=0;ship.grounded=true;jumpBuffer=0;}let accumulator=0,jumpBuffer=0;let seed=12;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}const stars=Array.from({length:110},()=>({x:random(),y:random(),depth:.2+random()*.8,size:.7+random()*1.6}));function resize(){const oldH=h;w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);ship.y=ship.grounded?h*.78-16:Math.min(ship.y+(h-oldH)*.78,h*.78-16);ship.previousY=ship.y;ship.previousAngle=ship.angle;accumulator=0;trail.length=0;}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump();keyboard=true;}});addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))keyboard=false;});canvas.addEventListener('pointerdown',e=>{jump();pointer=true;canvas.focus();canvas.setPointerCapture(e.pointerId);});for(const event of['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>pointer=false);function jump(){jumpBuffer=.12;}function simulate(dt){if(respawnDelay>0){respawnDelay-=dt;if(respawnDelay<=0)resetRun();return;}ship.previousY=ship.y;ship.previousAngle=ship.angle;distance+=250*dt;const floor=h*.78-16;if(ship.grounded&&(jumpBuffer>0||keyboard||pointer)){ship.grounded=false;ship.vy=-jumpSpeed;ship.jumpAge=0;ship.startAngle=ship.angle;jumpBuffer=0;}jumpBuffer=Math.max(0,jumpBuffer-dt);if(!ship.grounded){ship.jumpAge+=dt;ship.y+=ship.vy*dt+gravity*dt*dt*.5;ship.vy+=gravity*dt;const progress=Math.min(1,ship.jumpAge/flightTime);ship.angle=ship.startAngle+Math.PI*progress;if(ship.y>=floor&&ship.vy>=0){ship.y=floor;ship.vy=0;ship.grounded=true;ship.angle=ship.startAngle+Math.PI;}}else{ship.y=floor;ship.vy=0;}const cubeX=w*.29;for(const group of spikeGroups){const cycle=Math.floor(distance/levelLength);for(const repeat of[cycle-1,cycle,cycle+1])for(let i=0;i<group.count;i++){const sx=cubeX+group.at+repeat*levelLength+i*28-distance;if(sx+26<cubeX-13||sx>cubeX+13)continue;const overlapLeft=Math.max(cubeX-12,sx+3),overlapRight=Math.min(cubeX+12,sx+25);if(overlapLeft>overlapRight)continue;const sample=Math.max(overlapLeft,Math.min(sx+14,overlapRight)),height=30*(1-Math.abs(sample-(sx+14))/14);if(ship.y+12>h*.78-height+3){respawnDelay=.35;keyboard=pointer=false;return;}}}}function release(){keyboard=pointer=false;jumpBuffer=0;accumulator=0;last=0;}addEventListener('blur',release);document.addEventListener('visibilitychange',release);function path(points,fill,stroke){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}function frame(now){requestAnimationFrame(frame);if(document.hidden){last=0;return;}const dt=last?Math.min(.1,(now-last)/1000):0;last=now;time+=dt;accumulator+=dt;while(accumulator>=step){simulate(step);accumulator-=step;}const alpha=accumulator/step,drawY=ship.previousY+(ship.y-ship.previousY)*alpha,drawAngle=ship.previousAngle+(ship.angle-ship.previousAngle)*alpha,floorY=h*.78;const x=w*.29;const background=ctx.createLinearGradient(0,0,0,h);background.addColorStop(0,'#060e25');background.addColorStop(.55,'#10264b');background.addColorStop(1,'#18365d');ctx.fillStyle=background;ctx.fillRect(0,0,w,h);ctx.fillStyle='#0b1930';ctx.fillRect(0,floorY,w,h-floorY);ctx.strokeStyle='#5e9fb9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,floorY);ctx.lineTo(w,floorY);ctx.stroke();ctx.strokeStyle='#28425b';ctx.lineWidth=1;for(let gx=-(distance%64);gx<w;gx+=64){ctx.strokeRect(gx,floorY+10,54,32);}const cycle=Math.floor(distance/levelLength);for(const group of spikeGroups)for(const repeat of[cycle-1,cycle,cycle+1])for(let i=0;i<group.count;i++){const sx=x+group.at+repeat*levelLength+i*28-distance;if(sx<-30||sx>w+30)continue;path([[sx,floorY],[sx+14,floorY-30],[sx+28,floorY]],'#b5c4d1','#263e55');}ctx.save();ctx.translate(x,drawY);ctx.rotate(drawAngle);ctx.fillStyle='#66cc53';ctx.strokeStyle='#203e26';ctx.lineWidth=3;ctx.fillRect(-16,-16,32,32);ctx.strokeRect(-16,-16,32,32);ctx.restore();}requestAnimationFrame(frame);})();</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пустоты смены</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d0e;color:#dce2d7;font-family:Arial,sans-serif}body{background:radial-gradient(ellipse at 50% 15%,#28342e44,transparent 60%),linear-gradient(180deg,#0f1616,#090d0e 75%)}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#0002 3px 4px);opacity:.28}main{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:28px;transition:opacity .65s,filter .65s}main:before{content:'';position:absolute;width:1px;height:15vh;top:0;background:linear-gradient(#71837766,transparent)}.title{position:relative;margin:0 0 56px;text-align:center;font-size:clamp(34px,7vw,80px);font-weight:300;letter-spacing:.14em;line-height:1.3;text-transform:uppercase;text-shadow:0 0 32px #b8d0ac15}.title:after{content:'';display:block;width:42px;height:1px;background:#8d9b7b66;margin:28px auto 0}button{position:relative;min-width:240px;padding:17px 30px;border:1px solid #89937c5c;background:#b1c09b06;color:#d5ddc9;font:12px Arial,sans-serif;letter-spacing:.17em;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s,transform .2s}button:hover{background:#b1c09b10;border-color:#b2c09b;box-shadow:0 0 25px #bdce9c0b}button:active{transform:scale(.98)}button:focus-visible{outline:1px solid #d0dcb9;outline-offset:5px}button:before,button:after{content:'';position:absolute;top:50%;width:4px;height:4px;background:#829173;transform:translateY(-50%) rotate(45deg)}button:before{left:15px}button:after{right:15px}.leaving{opacity:0;filter:blur(5px);pointer-events:none}@media(prefers-reduced-motion:reduce){main,button{transition:none}}</style><style>html,body{background:#000}body:before,main:before{display:none}main{align-items:flex-start;padding:40px clamp(28px,8vw,130px)}.title{text-align:left;margin-bottom:40px}.title:after{margin:24px 0 0}</style></head><body><main id="menu"><h1 class="title">Пустоты смены</h1><button id="start" type="button">Начать смену</button></main><script>document.querySelector('#start').addEventListener('click',e=>{e.currentTarget.disabled=true;const menu=document.querySelector('#menu');menu.classList.add('leaving');setTimeout(()=>{menu.hidden=true;menu.style.display='none';},700);});</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

<html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Яйцо</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101d2a}body{display:grid;place-items:center;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 48%,#527b7650 0%,transparent 46%),radial-gradient(ellipse at 12% 12%,#4a426b85,transparent 55%),radial-gradient(ellipse at 90% 88%,#22575890,transparent 55%),linear-gradient(155deg,#19243c,#101e29 55%,#142f32)}body:before{content:'';position:fixed;inset:-15%;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 30% 40%,#96dac41a,transparent 38%),radial-gradient(ellipse at 70% 60%,#b29edf1a,transparent 36%);filter:blur(25px);animation:drift 18s ease-in-out infinite alternate}body:after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,#daebdca6 0 1px,transparent 2px),radial-gradient(circle,#b7dccc70 0 1px,transparent 2px),radial-gradient(circle,#d4c9ed55 0 1px,transparent 2px);background-size:237px 193px,347px 283px,173px 317px;background-position:25px 31px,92px 131px,45px 92px;mask-image:radial-gradient(ellipse at center,transparent 12%,#000 75%);opacity:.65}@keyframes drift{from{transform:translate(-3%,-2%) rotate(-4deg)}to{transform:translate(3%,3%) rotate(4deg)}}@media(prefers-reduced-motion:reduce){body:before{animation:none}}button{position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:50%;margin-left:-65px;width:130px;height:167px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;filter:drop-shadow(0 18px 26px #050e1855) drop-shadow(0 0 45px #deebba1c);transition:transform .12s}button:active{transform:scale(.92) rotate(-3deg)}button:focus-visible{outline:2px solid #b2a68a;outline-offset:12px;border-radius:50%}svg{width:100%;height:100%;overflow:visible}</style><style>.egg-counter{position:fixed;bottom:calc(max(28px,env(safe-area-inset-bottom)) + 177px);left:50%;transform:translateX(-50%);color:#e8efd5;font:600 16px system-ui;letter-spacing:2px;text-align:center;white-space:nowrap;text-shadow:0 2px 12px #0006;pointer-events:none}button:disabled{cursor:default}</style></head><body><button aria-label="Нажать на яйцо"><svg viewBox="0 0 210 270" aria-hidden="true"><defs><radialGradient id="shell" cx=".32" cy=".28" r=".8"><stop stop-color="#fffdf0"/><stop offset=".65" stop-color="#eee3c6"/><stop offset="1" stop-color="#cdbb95"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="5"/></filter></defs><ellipse cx="105" cy="249" rx="65" ry="9" fill="#877450" opacity=".14" filter="url(#blur)"/><path d="M105 18C71 18 22 100 22 163c0 49 34 79 83 79s83-30 83-79C188 100 139 18 105 18Z" fill="url(#shell)" stroke="#c6b693" stroke-width="2"/><path d="M80 51C61 70 45 103 42 126" fill="none" stroke="#fffef5" stroke-width="10" stroke-linecap="round" opacity=".65"/><g fill="#b7a17d" opacity=".27"><ellipse cx="128" cy="78" rx="3" ry="4" transform="rotate(-20 128 78)"/><ellipse cx="66" cy="151" rx="4" ry="3"/><ellipse cx="142" cy="173" rx="3" ry="5" transform="rotate(24 142 173)"/><ellipse cx="95" cy="206" rx="3" ry="2"/><circle cx="112" cy="126" r="2"/><circle cx="52" cy="186" r="2"/></g></svg></button><script>const egg=document.querySelector('button');const reduced=matchMedia('(prefers-reduced-motion: reduce)');egg.addEventListener('click',e=>{const b=e.currentTarget;b.getAnimations().forEach(a=>a.cancel());b.animate([{transform:'scale(.91) rotate(-4deg)',filter:'brightness(1.25) drop-shadow(0 0 24px #ffe6a870)'},{transform:'scale(1.07,.95) rotate(3deg)'},{transform:'scale(.98,1.03) rotate(-1deg)'},{transform:'scale(1) rotate(0)'}],{duration:reduced.matches?120:380,easing:'ease-out'});const r=b.getBoundingClientRect(),x=e.detail===0?r.left+r.width/2:e.clientX,y=e.detail===0?r.top+r.height*.55:e.clientY;if(document.querySelectorAll('.egg-fx').length>90)return;function particle(style,frames,duration){const el=document.createElement('i');el.className='egg-fx';el.style.cssText='position:fixed;pointer-events:none;z-index:10;left:'+x+'px;top:'+y+'px;'+style;document.body.append(el);const anim=el.animate(frames,{duration,easing:'cubic-bezier(.12,.6,.3,1)',fill:'forwards'});anim.onfinish=()=>el.remove();setTimeout(()=>el.remove(),duration+100);}particle('width:12px;height:12px;border:2px solid #ffe9b4;border-radius:50%;box-shadow:0 0 12px #ffe3a466',[{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:'translate(-50%,-50%) scale(7)',opacity:0}],reduced.matches?150:500);if(reduced.matches)return;for(let i=0;i<11;i++){const angle=Math.PI*2*(i/11)+(Math.random()-.5)*.5,dist=28+Math.random()*45,dx=Math.cos(angle)*dist,dy=Math.sin(angle)*dist-15,size=3+Math.random()*4,color=['#ffe6ac','#e8fff2','#c1b4fa','#91dfcf'][i%4];particle('width:'+size+'px;height:'+size+'px;background:'+color+';border-radius:'+(i%3?'50%':'1px')+';box-shadow:0 0 7px '+color+'80',[{transform:'translate(-50%,-50%) scale(1) rotate(0deg)',opacity:1},{transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(0) rotate(140deg)',opacity:0}],450+Math.random()*260);}});</script><script>(()=>{if(!/^https?:$/.test(location.protocol))return;let version='__GAME_VERSION__',busy=false,reloading=false;const valid=v=>typeof v==='string'&&/^[a-f0-9]{64}$/.test(v);if(!valid(version))version=null;async function check(){if(busy||reloading||document.hidden)return;busy=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),4000);try{const response=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:controller.signal});if(!response.ok)return;const next=(await response.text()).trim();if(!valid(next))return;if(version===null){version=next;return;}if(next!==version){reloading=true;location.reload();}}catch(e){}finally{clearTimeout(timeout);busy=false;}}setInterval(check,2000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});addEventListener('online',check);addEventListener('pageshow',check);check();})();</script><style>.meadow{position:fixed;left:50%;top:max(28px,env(safe-area-inset-top));transform:translateX(-50%);width:min(90vw,760px);height:calc(100% - 260px);max-height:490px;min-height:100px;border-radius:46% 46% 30% 30% / 20% 20% 28% 28%;background:radial-gradient(ellipse at 42% 30%,#a3ce7660,transparent 55%),radial-gradient(ellipse at center,#56835f,#365e4c 73%,#294d44);border:2px solid #a4cf8433;box-shadow:inset 0 5px 30px #b7e99b22,inset 0 -15px 25px #0c332744,0 25px 60px #050e183d;overflow:hidden}.meadow:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(ellipse,#e9dda8 0 2px,transparent 3px),radial-gradient(ellipse,#add28a 0 2px,transparent 3px),radial-gradient(ellipse,#e6afd3 0 1px,transparent 2px);background-size:139px 111px,53px 47px,191px 137px;background-position:27px 37px,14px 10px,68px 55px}.slime-field{position:absolute;inset:13% 8% 12%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 5px;overflow:auto;scrollbar-width:thin;scrollbar-color:#a4c79455 transparent}.slime{width:74px;height:74px;flex:0 0 74px;animation:slime-arrive .6s cubic-bezier(.2,.8,.3,1.2) both}.slime svg{animation:slime-idle 3s ease-in-out infinite;animation-delay:var(--delay)}@keyframes slime-arrive{from{opacity:0;transform:translateY(-35px) scale(.3)}65%{opacity:1;transform:translateY(3px) scale(1.13,.85)}to{transform:translateY(0) scale(1)}}@keyframes slime-idle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(.97,1.03)}}@media(max-width:500px){.slime{width:59px;height:59px;flex-basis:59px}.meadow{border-radius:40% 40% 26% 26% / 14% 14% 20% 20%}}@media(prefers-reduced-motion:reduce){.slime,.slime svg{animation:none}}</style><div class="meadow" aria-label="Полянка со слаймами"><div class="slime-field" role="list" aria-live="polite"></div></div>
<script>(()=>{const key='egg-meadow.slimes.v1',field=document.querySelector('.slime-field'),colors=[['#d9f8b2','#86c58a'],['#c3edff','#7badde'],['#fbd1e8','#d792b7'],['#e6d7ff','#ab91d9'],['#fff0b0','#dfbc70'],['#bdf5e4','#72c4b0']];let slimes=[];try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))slimes=saved.filter(n=>Number.isInteger(n)&&n>=0&&n<colors.length);}catch(e){}let serial=0;function show(kind,animate=true){const id='slime'+serial++,c=colors[0],el=document.createElement('div');el.className='slime';el.setAttribute('role','listitem');el.setAttribute('aria-label','Слаймик');el.style.setProperty('--delay',(-Math.random()*3)+'s');if(!animate)el.style.animation='none';el.innerHTML='<svg viewBox="0 0 86 82" aria-hidden="true"><defs><radialGradient id="'+id+'" cx=".35" cy=".2" r=".9"><stop stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></radialGradient></defs><ellipse cx="43" cy="72" rx="29" ry="5" fill="#16392f44"/><path d="M12 59C10 41 23 17 42 17s34 24 32 42C72 76 14 77 12 59Z" fill="url(#'+id+')" stroke="'+c[1]+'" stroke-width="2"/><path d="M23 40q4-10 13-12" stroke="#ffffff99" stroke-width="5" stroke-linecap="round" fill="none"/><ellipse cx="33" cy="51" rx="3" ry="4.5" fill="#304b50"/><ellipse cx="54" cy="51" rx="3" ry="4.5" fill="#304b50"/><circle cx="32" cy="49" r="1" fill="white"/><circle cx="53" cy="49" r="1" fill="white"/><path d="M39 58q4 5 9 0" stroke="#50665d" stroke-width="2" stroke-linecap="round" fill="none"/><ellipse cx="25" cy="59" rx="5" ry="3" fill="#f2a6b077"/><ellipse cx="62" cy="59" rx="5" ry="3" fill="#f2a6b077"/></svg>';field.append(el);if(animate)el.scrollIntoView({block:'nearest',behavior:'smooth'});}slimes.forEach(k=>show(k,false));let clicks=0,hatching=false;const eggButton=document.querySelector('button'),counter=document.createElement('div');counter.className='egg-counter';counter.setAttribute('aria-live','polite');counter.textContent='0/5';document.body.append(counter);eggButton.addEventListener('click',()=>{if(hatching)return;clicks++;counter.textContent=clicks+'/5';if(clicks<5)return;clicks=0;hatching=true;eggButton.disabled=true;const success=Math.random()<.75;counter.textContent=success?'5/5 ✨':'5/5 · не вылупился';if(!success){setTimeout(reset,650);return;}slimes.push(0);try{localStorage.setItem(key,JSON.stringify(slimes));}catch(e){}show(0,false);const target=field.lastElementChild;target.style.visibility='hidden';target.scrollIntoView({block:'nearest',behavior:'instant'});const r=eggButton.getBoundingClientRect(),dest=target.getBoundingClientRect();eggButton.style.visibility='hidden';for(const side of[-1,1]){const half=document.createElement('div');half.className='hatch-half';half.style.cssText='position:fixed;pointer-events:none;z-index:12;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;clip-path:'+(side===-1?'polygon(0 0,52% 0,45% 30%,56% 43%,44% 56%,54% 70%,47% 100%,0 100%)':'polygon(52% 0,100% 0,100% 100%,47% 100%,54% 70%,44% 56%,56% 43%,45% 30%)');half.innerHTML=eggButton.innerHTML;document.body.append(half);half.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{offset:.6,transform:'translate('+side*48+'px,-15px) rotate('+side*25+'deg)',opacity:1},{transform:'translate('+side*90+'px,75px) rotate('+side*65+'deg)',opacity:0}],{duration:780,easing:'ease-out',fill:'forwards'});setTimeout(()=>half.remove(),850);}const flying=target.cloneNode(true);flying.className='flying-slime';flying.removeAttribute('role');flying.style.cssText='position:fixed;pointer-events:none;visibility:visible;z-index:13;left:'+(r.left+r.width/2-37)+'px;top:'+(r.top+r.height*.4-37)+'px;width:74px;height:74px;';document.body.append(flying);const dx=dest.left+dest.width/2-(r.left+r.width/2),dy=dest.top+dest.height/2-(r.top+r.height*.4);flying.animate([{transform:'translate(0,12px) scale(.25)',opacity:0},{offset:.2,transform:'translate(0,-45px) scale(1.15)',opacity:1},{offset:.75,transform:'translate('+dx*.8+'px,'+(dy-35)+'px) scale(1)'},{transform:'translate('+dx+'px,'+dy+'px) scale('+(dest.width/74)+')',opacity:1}],{duration:1050,easing:'cubic-bezier(.25,.6,.4,1)',fill:'forwards'});setTimeout(()=>{flying.remove();target.style.visibility='visible';target.animate([{transform:'scale(1.2,.8)'},{transform:'scale(.94,1.06)'},{transform:'scale(1)'}],{duration:300});reset();},1080);});function reset(){hatching=false;eggButton.disabled=false;eggButton.style.visibility='visible';eggButton.animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],{duration:240});counter.textContent='0/5';}
})();</script>

</style></head><body><!-- Updater compatibility: simple-coin-clicker.v1 --><div id="rotateHint" role="status"><div><div class="rotate-icon">↻</div><strong>Поверни телефон</strong><p>Держи телефон горизонтально, чтобы играть</p></div></div><div id="gameScreen"><div id="nameOverlay"><form id="nameForm"><h1>Как тебя зовут?</h1><p>Этот ник увидят другие игроки</p><input id="nickname" type="text" maxlength="40" placeholder="Твой ник" aria-label="Ник игрока" autocomplete="nickname" enterkeyhint="go" required><button type="submit">Играть</button><small>Ник сохранится на этом устройстве</small><div id="nameError" role="status"></div></form></div><canvas id="game" aria-label="Двумерная игра, вид сверху. Управление WASD, стрелками или джойстиком."></canvas><div id="sporeHud" role="status"><span>Споры</span><strong id="sporeCount">0 / 30</strong><div class="bag-track"><i id="bagFill"></i></div><span class="mycelium-label">Мицелий</span><strong id="myceliumCount">0</strong></div><div class="hint"><strong>Грибная команда</strong><div id="networkStatus" style="margin:6px 0;color:#687b89">Подключение…</div><div id="taskHint">Справа — поляна · найди свой домик</div><span id="help">WASD / стрелки — движение</span></div><div id="stick" role="group" aria-label="Джойстик движения"><div id="knob"></div></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),keys=new Set();const player={x:0,y:0,r:17,speed:225};let rotated=false,w=0,h=0,dpr=1,axisX=0,axisY=0,pointer=null,last=0;try{localStorage.removeItem('topdown-game.button-clicks');}catch(e){}const NAME_KEY='topdown-game.nickname';function cleanName(value){return [...value.replace(/[\x00-\x1f\x7f-\x9f\u200b-\u200f\u202a-\u202e\u2060-\u206f]/g,'').trim()].slice(0,20).join('');}let nickname='';try{nickname=cleanName(localStorage.getItem(NAME_KEY)||'');}catch(e){}const nameOverlay=document.querySelector('#nameOverlay'),nameInput=document.querySelector('#nickname');if(nickname)nameOverlay.hidden=true;document.querySelector('#nameForm').addEventListener('submit',e=>{e.preventDefault();const name=cleanName(nameInput.value);if(!name){document.querySelector('#nameError').textContent='Введи ник от 1 до 20 символов';return;}nickname=name;try{localStorage.setItem(NAME_KEY,nickname);}catch(e){}nameOverlay.hidden=true;nameInput.blur();keys.clear();nextJoin=0;networkStep();});
let session=null,seq=0,pendingMoves=[],networkBusy=false,inputX=0,inputY=0,others=[],online=false,nextJoin=0;const netStatus=document.querySelector('#networkStatus');async function request(url,data){const controller=new AbortController();let timeout;try{return await Promise.race([(async()=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal,cache:'no-store'});if(!r.ok){if(r.status===401){session=null;try{sessionStorage.removeItem('topdown-game.session');}catch(e){}}const error=Error('HTTP '+r.status);error.status=r.status;throw error;}return await r.json();})(),new Promise((_,reject)=>{timeout=setTimeout(()=>{controller.abort();reject(Error('Network timeout'));},8000);})]);}finally{clearTimeout(timeout);}}
let visibleHomes=Array.from({length:5},(_,slot)=>({slot,x:-480+slot*240,y:-500,name:'',online:false,occupied:false}));function applyState(list,joining=false,homes=null){if(Array.isArray(homes))visibleHomes=homes;if(!Array.isArray(list))return;const me=list.find(p=>p.id===session?.id);if(me){if(me.home&&Number.isFinite(me.home.x)&&Number.isFinite(me.home.y)){home.x=me.home.x;home.y=me.home.y;home.slot=me.home.slot;try{localStorage.setItem('mushroom-team.home-slot',String(me.home.slot));}catch(e){}}if(joining){pendingMoves=[];seq=me.ack||0;}else pendingMoves=pendingMoves.filter(cmd=>cmd.seq>me.ack);player.x=me.x;player.y=me.y;for(const cmd of pendingMoves)moveOnMap(player,cmd.x*player.speed*cmd.dt,cmd.y*player.speed*cmd.dt);player.color=me.color;}const old=new Map(others.map(p=>[p.id,p])),received=performance.now();others=list.filter(p=>p.id!==session?.id).map(p=>{const history=old.get(p.id)?.history||[];history.push({t:received,x:p.x,y:p.y});while(history.length>12)history.shift();return {...p,history};});online=true;netStatus.textContent='В сети: '+list.length+' · ты — кружок с точкой';}async function networkStep(){if(!nickname||networkBusy||Date.now()<nextJoin)return;networkBusy=true;try{if(!session){let resume=null;try{resume=JSON.parse(sessionStorage.getItem('topdown-game.session')||'null');}catch(e){}let homeSlot=null;try{const saved=localStorage.getItem('mushroom-team.home-slot');if(saved!==null)homeSlot=Number(saved);}catch(e){}let owner=null;try{owner=JSON.parse(localStorage.getItem('mushroom-team.owner')||'null');}catch(e){}const d=await request('/join',{name:nickname,resume,homeSlot,owner,mycelium});if(d.owner){try{localStorage.setItem('mushroom-team.owner',JSON.stringify(d.owner));}catch(e){}}session={id:d.id,token:d.token};try{sessionStorage.setItem('topdown-game.session',JSON.stringify(session));}catch(e){}applyState(d.players,true,d.homes);}else{const pet=mushroomFollowers.get(session.id);const d=await request('/input',{...session,commands:pendingMoves. let gameVersion='__GAME_VERSION__',updatePending=false;if(!/^[a-f0-9]{64}$/.test(gameVersion))gameVersion=null;let lastAutoReload={};try{lastAutoReload=JSON.parse(sessionStorage.getItem('new-game.last-auto-reload')||'{}');}catch(e){}function checkVersion(v,at,serverTime,rtt=0){if(!/^[a-f0-9]{64}$/.test(v))return;if(!gameVersion){gameVersion=v;return;}if(v===gameVersion||updatePending||lastAutoReload.version===v||!Number.isFinite(at)||!Number.isFinite(serverTime))return;updatePending=true;const remaining=Math.max(200,at-serverTime-rtt/2);showUpdateBanner(remaining);setTimeout(()=>{try{sessionStorage.setItem('new-game.last-auto-reload',JSON.stringify({version:v,at:Date.now()}));}catch(e){}const url=new URL(location.href);url.searchParams.set('build',v.slice(0,12));location.replace(url.href);},remaining);}let versionChecking=false;async function pollVersion(){if(versionChecking||document.hidden)return;versionChecking=true;const started=performance.now();try{const r=await fetch('/update-status?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(r.ok){const d=await r.json();checkVersion(d.version,d.updateAt,d.serverTime,performance.now()-started);}}catch(e){}finally{versionChecking=false;}}pollVersion();setInterval(pollVersion,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollVersion();});setInterval(networkStep,50);setTimeout(networkStep,0);
const mapObjects=[];function blocked(x,y,r){for(const o of mapObjects){if(o.type==='tree'||o.type==='rock'){const radius=o.type==='tree'?11:o.r*.86;if(Math.hypot(x-o.x,y-o.y)<r+radius)return true;}else{const nx=Math.max(o.x-o.w/2,Math.min(o.x+o.w/2,x)),ny=Math.max(o.y-o.h/2,Math.min(o.y+o.h/2,y));if(Math.hypot(x-nx,y-ny)<r)return true;}}return false;}function moveOnMap(p,dx,dy,r=17){const nx=Math.max(-750+r,Math.min(750-r,p.x+dx)),ny=Math.max(-750+r,Math.min(750-r,p.y+dy));if(!blocked(nx,p.y,r))p.x=nx;if(!blocked(p.x,ny,r))p.y=ny;}
const world={width:1500,height:1500};function resize(){if(typeof keys!=='undefined')keys.clear();axisX=axisY=0;rotated=false;document.body.classList.remove('rotated');w=rotated?innerHeight:innerWidth;h=rotated?innerWidth:innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}addEventListener('resize',resize);resize();const movement=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||!nickname)return;if(movement.includes(e.code)){e.preventDefault();keys.add(e.code);}});addEventListener('keyup',e=>keys.delete(e.code));function resetStick(){pointer=null;axisX=axisY=0;knob.style.transform='translate(0px,0px)';}function reset(){keys.clear();resetStick();inputX=inputY=0;last=0;if(session)fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...session,commands:[]}),keepalive:true}).catch(()=>{});}addEventListener('blur',reset);document.addEventListener('visibilitychange',reset);function moveStick(e){if(e.pointerId!==pointer)return;const r=stick.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(rotated){const oldX=x;x=y;y=-oldX;}const len=Math.hypot(x,y),max=rotated?33:42;if(len>max){x=x/len*max;y=y/len*max;}axisX=x/max;axisY=y/max;if(Math.hypot(axisX,axisY)<.1)axisX=axisY=0;knob.style.transform=`translate(${x}px,${y}px)`;}stick.addEventListener('pointerdown',e=>{if(pointer!==null)return;e.preventDefault();pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e);});stick.addEventListener('pointermove',moveStick);for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,e=>{if(e.pointerId===pointer)resetStick();});function touchMode(){document.body.classList.add('touch');document.querySelector('#help').textContent='Джойстик слева — движение';}if(navigator.maxTou const SPORE_SAVE='mushroom-team.spores.v1',field={x:260,y:30,w:300,h:260};let sporesCollected=0;try{const n=Number(localStorage.getItem(SPORE_SAVE));if(Number.isSafeInteger(n)&&n>=0)sporesCollected=n;}catch(e){}const ECONOMY_SAVE='mushroom-team.economy.v1',bagCapacity=30,home={x:-250,y:0,radius:78};let mycelium=0,conversionClock=0,converting=false;try{const saved=JSON.parse(localStorage.getItem(ECONOMY_SAVE)||'null');if(saved&&saved.schema===1&&Number.isSafeInteger(saved.spores)&&saved.spores>=0&&Number.isSafeInteger(saved.mycelium)&&saved.mycelium>=0){sporesCollected=saved.spores;mycelium=saved.mycelium;}}catch(e){}const sporeLabel=document.querySelector('#sporeCount'),myceliumLabel=document.querySelector('#myceliumCount'),bagFill=document.querySelector('#bagFill'),taskHint=document.querySelector('#taskHint');function saveEconomy(){try{localStorage.setItem(ECONOMY_SAVE,JSON.stringify({schema:1,spores:sporesCollected,mycelium}));}catch(e){}}function updateEconomyHud(){sporeLabel.textContent=sporesCollected.toLocaleString('ru-RU')+' / '+bagCapacity;myceliumLabel.textContent=mycelium.toLocaleString('ru-RU');bagFill.style.width=Math.min(100,sporesCollected/bagCapacity*100)+'%';bagFill.style.background=sporesCollected>=bagCapacity?'#efb68a':'#a8ce8e';taskHint.textContent=converting?'Переработка: 1 спора → 1 мицелий':sporesCollected>=bagCapacity?'Сумка полна — отнеси споры в свой домик':sporesCollected>0?'Собирай дальше или отнеси споры в свой домик':'Домики сверху · поляна справа';}function updateHome(dt){const active=!!nickname&&!!session&&Math.hypot(player.x-home.x,player.y-home.y)<home.radius&&sporesCollected>0&&mycelium<Number.MAX_SAFE_INTEGER;const changed=active!==converting;converting=active;if(!active){conversionClock=0;if(changed)updateEconomyHud();return;}conversionClock+=dt;let converted=false;while(conversionClock>=.2&&sporesCollected>0&&mycelium<Number.MAX_SAFE_INTEGER){conversionClock-=.2;sporesCollected--;mycelium++;converted=true;}if(converted){saveEcono const spores=Array.from({length:36},(_,i)=>({x:field.x-field.w/2+27+(i%6)*49+(i%3-1)*3,y:field.y-field.h/2+24+Math.floor(i/6)*43+(i%2)*6,readyAt:0})),sporePops=[];let harvestTarget=-1,harvestStarted=0,lastHarvestAt=-10000;function inSporeField(x,y){return Math.abs(x-field.x)<field.w/2+42&&Math.abs(y-field.y)<field.h/2+42;}function chooseSpore(pet,now){let best=-1,distance=Infinity;for(let i=0;i<spores.length;i++){const sp=spores[i];if(sp.readyAt>now)continue;const d=Math.hypot(sp.x-pet.x,sp.y-pet.y);if(d<distance){distance=d;best=i;}}return best;}function collectSpore(index,now){if(sporesCollected>=bagCapacity)return;const sp=spores[index];sp.readyAt=now+12000;sporesCollected=Math.min(Number.MAX_SAFE_INTEGER,sporesCollected+1);saveEconomy();updateEconomyHud();sporePops.push({x:sp.x,y:sp.y,t:now});lastHarvestAt=now;harvestTarget=-1;harvestStarted=0;}function drawSporeField(){const now=performance.now();ctx.save();ctx.translate(field.x,field.y);ctx.fillStyle='#354f41';ctx.strokeStyle='#8ea978';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-field.w/2-8,-field.h/2-8,field.w+16,field.h+16,23);ctx.fill();ctx.stroke();ctx.fillStyle='#567453';ctx.beginPath();ctx.roundRect(-field.w/2,-field.h/2,field.w,field.h,17);ctx.fill();ctx.strokeStyle='#8fb17422';ctx.lineWidth=1;for(let y=-100;y<=100;y+=43){ctx.beginPath();ctx.moveTo(-136,y);ctx.lineTo(136,y);ctx.stroke();}ctx.fillStyle='#dbe9c2';ctx.font='600 13px Arial';ctx.textAlign='center';ctx.fillText('Поляна спор',0,-field.h/2-22);ctx.restore();for(let i=0;i<spores.length;i++){const sp=spores[i];if(sp.readyAt>now){ctx.fillStyle='#314d3d';ctx.beginPath();ctx.ellipse(sp.x,sp.y+3,4,2,0,0,Math.PI*2);ctx.fill();continue;}ctx.save();ctx.translate(sp.x,sp.y);const sway=Math.sin(now*.0017+i)*1.2;ctx.fillStyle='#cfdfb0';ctx.fillRect(-1,0,2,6);ctx.fillStyle=['#efe0a1','#c6b1ef','#b2dfcf'][i%3];ctx.beginPath();ctx.ellipse(0,-1+sway,6.5,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff5d7b0';ctx.beginPath();ctx.arc(-2,-3+sway,1.6,0,Math.PI*2) const mushroomFollowers=new Map();let petFrameAt=0;function drawMushroomPet(id,ownerX,ownerY,remotePet=null){if(!nickname)return;const now=performance.now(),dt=Math.min(.05,Math.max(0,(now-petFrameAt)/1000));let pet=mushroomFollowers.get(id);if(!pet){let seed=0;for(const ch of id)seed=(seed*31+ch.charCodeAt(0))>>>0;pet={x:ownerX-38,y:ownerY+36,phase:(seed%628)/100,moving:false};mushroomFollowers.set(id,pet);}const mine=id===(session?.id||'local');let goalX=ownerX,goalY=ownerY,stopDistance=44,working=false;if(mine){if(inSporeField(ownerX,ownerY)&&sporesCollected<bagCapacity){if(harvestTarget<0||spores[harvestTarget].readyAt>now){harvestTarget=chooseSpore(pet,now);harvestStarted=0;}if(harvestTarget>=0){goalX=spores[harvestTarget].x;goalY=spores[harvestTarget].y;stopDistance=0;working=true;}}else{harvestTarget=-1;harvestStarted=0;}}else if(remotePet&&Number.isFinite(remotePet.x)&&Number.isFinite(remotePet.y)){goalX=remotePet.x;goalY=remotePet.y;stopDistance=0;working=!!remotePet.working;}pet.working=working;let dx=goalX-pet.x,dy=goalY-pet.y,distance=Math.hypot(dx,dy);if(distance>260){pet.x=ownerX-38;pet.y=ownerY+36;distance=0;}let travel=0;if(distance>stopDistance+1){travel=Math.min(distance-stopDistance,Math.max(145,Math.min(310,(distance-stopDistance)*9))*dt);pet.x+=dx/distance*travel;pet.y+=dy/distance*travel;}if(mine&&working&&harvestTarget>=0){if(Math.hypot(goalX-pet.x,goalY-pet.y)<4){if(!harvestStarted)harvestStarted=now;if(now-harvestStarted>=700)collectSpore(harvestTarget,now);}else harvestStarted=0;}pet.phase+=travel/10;const bounce=working&&travel<=.05?Math.abs(Math.sin(now*.011))*3:travel>.05?Math.max(0,Math.sin(pet.phase))*5:Math.sin(now*.002+pet.phase)*.45;const squash=travel>.05?Math.sin(pet.phase)*.045:Math.sin(now*.002)*.012;ctx.save();ctx.translate(pet.x,pet.y);ctx.scale(.7,.7);ctx.fillStyle='#24232d30';ctx.beginPath();ctx.ellipse(0,10,13-bounce*.25,5-bounce*.1,0,0,Math.PI*2);ctx.fill();ctx.translate(0,-bounce);ctx.scale(1-squash,1+squash);ctx.lineWidt function drawHome(h=home,ownerName=nickname,mine=true,ownerOnline=true){const active=mine&&converting,now=performance.now(),roof=mine?'#df8374':ownerOnline?'#bc91aa':'#b7a281';ctx.save();ctx.translate(h.x,h.y);ctx.fillStyle='#496b43';ctx.beginPath();ctx.ellipse(0,16,87,69,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=mine?'#e6d69b':'#a0b47a';ctx.lineWidth=2;ctx.setLineDash([4,7]);ctx.beginPath();ctx.ellipse(0,13,84,66,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);for(let i=0;i<3;i++){ctx.fillStyle=['#aeb59b','#bfc2a4','#d1c9a7'][i];ctx.beginPath();ctx.ellipse(0,48+i*18,15+i*2,6,0,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#314c3330';ctx.beginPath();ctx.ellipse(2,33,44,13,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#665640';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.fillStyle='#eddbb3';ctx.beginPath();ctx.moveTo(-30,-27);ctx.quadraticCurveTo(-31,5,-34,30);ctx.quadraticCurveTo(0,43,34,30);ctx.quadraticCurveTo(28,0,29,-27);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#d8bd91';ctx.beginPath();ctx.ellipse(0,-22,47,10,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b49673';ctx.lineWidth=1;for(let x=-33;x<=33;x+=11){ctx.beginPath();ctx.moveTo(x,-25);ctx.lineTo(x*.6,-14);ctx.stroke();}ctx.fillStyle=roof;ctx.strokeStyle='#744f48';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-51,-25);ctx.bezierCurveTo(-48,-48,-31,-76,-1,-78);ctx.bezierCurveTo(29,-80,49,-49,52,-25);ctx.quadraticCurveTo(3,-10,-51,-25);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#ffe4bb90';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.bezierCurveTo(-39,-40,-31,-59,-19,-63);ctx.stroke();ctx.fillStyle='#fff0ce';for(const [x,y,rx,ry]of [[-23,-43,8,5],[4,-64,8,5],[28,-40,7,5],[-2,-31,5,3]]){ctx.beginPath();ctx.ellipse(x,y,rx,ry,x*.008,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#8d684c';ctx.strokeStyle='#64523f';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-13,2,26,34,[13,13,3,3]);ctx.fill();ctx.stroke();ctx.strokeStyle='#b58d66';ctx.lineWidth=1;for(const x of [-6,2,8]){ctx.beginPath();ctx.moveTo(x,13);ctx.lineTo(x,33);ctx.stroke();}ctx.fillStyle='#f4d18b';ctx.beginPath();ctx.arc(7,23,2,0,Math.PI*2);ctx.fill();ctx.fillStyle=active?'#fff0b4':'#d0e8cc';ctx.strokeStyle='#a68a62';ctx.lineWidth=3;ctx.beginPath();ctx.arc(18,-2,9,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(9,-2);ctx.lineTo(27,-2);ctx.moveTo(18,-11);ctx.lineTo(18,7);ctx.stroke();for(const side of [-1,1]){ctx.fillStyle='#779b58';for(let j=0;j<3;j++){ctx.beginPath();ctx.ellipse(side*(48+j*5),27-j*5,4,10,side*(.4+j*.2),0,Math.PI*2);ctx.fill();}ctx.fillStyle=mine?'#f3c7ad':'#e8dcad';ctx.beginPath();ctx.arc(side*55,10,3,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#f5f0da';ctx.font='600 12px Arial';ctx.textAlign='center';ctx.fillText(mine?'Твой домик · '+ownerName:ownerName?'Домик '+ownerName:'Свободный домик',0,110);ctx.fillStyle='#d4dfbd';ctx.font='10px Arial';ctx.fillText(mine?(active?'Переработка спор…':'Подойди со спорами'):ownerOnline?'Занят':'Свободен',0,126);if(active){for(let i=0;i<5;i++){const t=(now/1100+i*.2)%1;ctx.globalAlpha=Math.sin(t*Math.PI);ctx.fillStyle='#f6dfa6';ctx.beginPath();ctx.arc(Math.sin(i*2.4)*26*(1-t),44-t*35,2.2,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}ctx.restore();}
const grassTile=document.createElement('canvas');grassTile.width=grassTile.height=480;const grassCtx=grassTile.getContext('2d');grassCtx.fillStyle='#668750';grassCtx.fillRect(0,0,480,480);let grassSeed=72413;function grassRandom(){grassSeed=(Math.imul(grassSeed,1664525)+1013904223)>>>0;return grassSeed/4294967296;}for(let i=0;i<1500;i++){const x=grassRandom()*480,y=grassRandom()*480;grassCtx.strokeStyle=i%3===0?'#a0b97444':i%3===1?'#3f673b44':'#75985688';grassCtx.lineWidth=1;grassCtx.beginPath();grassCtx.moveTo(x,y);grassCtx.lineTo(x-2,y-3-grassRandom()*4);grassCtx.moveTo(x,y);grassCtx.lineTo(x+2,y-2-grassRandom()*3);grassCtx.stroke();}for(let i=0;i<14;i++){const x=grassRandom()*460+10,y=grassRandom()*460+10;grassCtx.fillStyle=i%3?'#d5d9a96b':'#eac8a376';for(let j=0;j<4;j++){grassCtx.beginPath();grassCtx.arc(x+Math.cos(j*Math.PI/2)*2,y+Math.sin(j*Math.PI/2)*2,1.5,0,Math.PI*2);grassCtx.fill();}}const grassPattern=ctx.createPattern(grassTile,'repeat');
function draw(){ctx.fillStyle='#344c34';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w/2-player.x,h/2-player.y);ctx.fillStyle=grassPattern;ctx.fillRect(-750,-750,1500,1500);ctx.strokeStyle='#354e34';ctx.lineWidth=5;ctx.strokeRect(-750,-750,1500,1500);if(visibleHomes.length){for(const plot of visibleHomes)drawHome(plot,plot.name,plot.slot===home.slot,plot.online);}else if(nickname)drawHome();drawSporeField();for(const other of others){const history=other.history,target=performance.now()-110;while(history.length>2&&history[1].t<=target)history.shift();const from=history[0],to=history[1]||from;const blend=to.t>from.t?Math.max(0,Math.min(1,(target-from.t)/(to.t-from.t))):1;other.drawX=from.x+(to.x-from.x)*blend;other.drawY=from.y+(to.y-from.y)*blend;drawMushroomPet(other.id,other.drawX,other.drawY,other.pet);ctx.beginPath();ctx.arc(other.drawX,other.drawY,17,0,Math.PI*2);ctx.fillStyle=other.color;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();drawPlayerName(other.name||'Игрок',other.drawX,other.drawY,other.mycelium);}if(nickname)drawMushroomPet(session?.id||'local',player.x,player.y);ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fillStyle=player.color||'#557fa0';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.beginPath();ctx.arc(player.x,player.y,3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();if(nickname)drawPlayerName(nickname,player.x,player.y,mycelium);ctx.restore();petFrameAt=performance.now();cleanMushroomFollowers();}function leaveServer(){reset();if(session){const data=JSON.stringify(session);if(navigator.sendBeacon)navigator.sendBeacon('/leave',new Blob([data],{type:'application/json'}));else fetch('/leave',{method:'POST',headers:{'Content-Type':'application/json'},body:data,keepalive:true}).catch(()=>{});session=null;}others=[];}window.addEventListener('pagehide',leaveServer);window.addEventListener('pageshow',e=>{if(e.persisted){session=null;nextJoin=0;networkStep();}});requestAnimationFrame(frame);})(

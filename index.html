<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="app-id" content="arena-coin-clicker"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вид сверху</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eff1ee;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}.hint{position:fixed;left:24px;bottom:24px;color:#626d67;font-size:13px;pointer-events:none;background:#ffffffd9;padding:12px 16px;border:1px solid #dce1da;border-radius:12px}kbd{font:600 12px system-ui;display:inline-block;padding:3px 6px;margin:0 2px;background:white;border:1px solid #dce1da;border-radius:4px;color:#293e34}.label{position:fixed;top:24px;left:26px;font-size:11px;letter-spacing:2px;color:#819087;pointer-events:none}</style></head><body><canvas id="game" tabindex="0" aria-label="Игровое поле. Ходьба на WASD или стрелках."></canvas><div class="label">ВИД СВЕРХУ / 2D</div><div class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — ходьба <span style="opacity:.55">· или стрелки</span></div><script>(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),keys=new Set(),player={x:0,y:0,angle:0,phase:0,moving:false},camera={x:0,y:0};let w=0,h=0,last=0;function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);}addEventListener('resize',resize);resize();const codes=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight'];addEventListener('keydown',e=>{if(codes.includes(e.code)){e.preventDefault();keys.add(e.code);}});addEventListener('keyup',e=>keys.delete(e.code));function clear(){keys.clear();last=0;}addEventListener('blur',clear);document.addEventListener('visibilitychange',clear);canvas.addEventListener('pointerdown',()=>canvas.focus());function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}function frame(now){requestAnimationFrame(frame);const dt=last?Math.min((now-last)/1000,.05):0;last=now;let dx=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),dy=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));const length=Math.hypot(dx,dy);player.moving=length>0;if(length){dx/=length;dy/=length;player.x+=dx*190*dt;player.y+=dy*190*dt;const target=Math.atan2(dy,dx)+Math.PI/2,delta=Math.atan2(Math.sin(target-player.angle),Math.cos(target-player.angle));player.angle+=delta*(1-Math.exp(-20*dt));player.phase+=dt*13;}const follow=1-Math.exp(-7*dt);camera.x+=(player.x-camera.x)*follow;camera.y+=(player.y-camera.y)*follow;ctx.fillStyle='#eff1ee';ctx.fillRect(0,0,w,h);const ox=w/2-camera.x,oy=h/2-camera.y,grid=64;ctx.strokeStyle='#e1e6df';ctx.lineWidth=1;ctx.beginPath();for(let x=((ox%grid)+grid)%grid;x<w;x+=grid){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,h);}for(let y=((oy%grid)+grid)%grid;y<h;y+=grid){ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(w,Math.round(y)+.5);}ctx.stroke();ctx.strokeStyle='#c8d3c9';ctx.beginPath();ctx.arc(ox,oy,6,0,Math.PI*2);ctx.stroke();const px=player.x+ox,py=player.y+oy,step=player.moving?Math.sin(player.phase)*5:0;ellipse(px+2,py+8,19,12,'#1c342323');ctx.save();ctx.translate(px,py);ctx.rotate(player.angle);ellipse(-7,5+step,5,9,'#293b35');ellipse(7,5-step,5,9,'#293b35');ellipse(-14,-step*.45,5,7,'#c39d77');ellipse(14,step*.45,5,7,'#c39d77');ellipse(0,0,16,11,'#386951');ellipse(0,2,12,8,'#477f61');ellipse(0,-5,10,11,'#d5b18c');ellipse(0,-2,10,8,'#443e33');ellipse(-2,-4,7,5,'#554d3d');ctx.restore();}window.gamePlayer=player;requestAnimationFrame(frame);})();</script><script>(()=>{let version='__GAME_VERSION__',busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/version?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)return;const next=(await r.text()).trim();if(!/^[a-f0-9]{64}$/.test(next))return;if(!/^[a-f0-9]{64}$/.test(version)){version=next;return;}if(next!==version)location.reload();}catch(e){}finally{busy=false;}}if(/^https?:$/.test(location.protocol)){setInterval(check,2000);document.addEventListener('visibilitychange',check);check();}})();</script></body></html>

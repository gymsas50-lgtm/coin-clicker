<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0f}#scene{position:fixed;inset:0;display:grid;place-items:center;cursor:default;touch-action:auto}#scene.dragging{cursor:default}canvas:focus-visible{outline:1px solid #b8a17c66;outline-offset:-8px}canvas{display:block;position:absolute;inset:0;width:100%;height:100%;outline:none}.fallback{width:min(480px,88vw);height:auto;filter:drop-shadow(0 18px 24px #0008)}.ready .fallback{display:none}.version{position:fixed;bottom:16px;left:20px;z-index:5;color:#737779;font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;user-select:none;pointer-events:none}

:root{--game-cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2236%22%20viewBox%3D%220%200%2032%2036%22%3E%3Cpath%20d%3D%22M4%202L5%2029l7-7%205%2011%205-2-5-11%2010-1Z%22%20fill%3D%22%23dbc088%22%20stroke%3D%22%23261d13%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22m7%207%201%2015%204-5%209%200Z%22%20fill%3D%22%23fff0c5%22%2F%3E%3Cpath%20d%3D%22m7%207%201%2015%22%20fill%3D%22none%22%20stroke%3D%22%23fff8df%22%20stroke-width%3D%221.2%22%2F%3E%3C%2Fsvg%3E") 4 2,auto}html,body,body *{cursor:var(--game-cursor)!important}
.loot-inventory{position:fixed;z-index:8;bottom:22px;right:22px;width:274px;padding:16px 18px;border:1px solid #b69a5d26;border-radius:14px;background:#171b1fe8;color:#d8d5c9;font:12px system-ui,sans-serif;user-select:none}.loot-heading{font-size:9px;letter-spacing:.18em;color:#969b91;margin-bottom:10px}.loot-row{display:flex;align-items:center;gap:10px;padding:6px 0}.loot-row svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.loot-row strong{margin-left:auto;color:#e3e0d6;font-variant-numeric:tabular-nums}.wood{color:#c99d68}.stone{color:#a4b4bd}.iron{color:#d2dde4}.key{color:#e0c17b}.loot-toast{position:fixed;z-index:9;top:21%;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;text-align:center;min-width:230px;padding:16px 24px;border:1px solid #c7a66d45;border-radius:12px;background:#171a1df2;box-shadow:0 12px 35px #0004;font-family:system-ui,sans-serif;transition:opacity .22s,transform .22s}.loot-toast.show{opacity:1;transform:translate(-50%,0)}.loot-eyebrow,.loot-detail{display:block;color:#aaa99a;font-size:10px;letter-spacing:.08em}.loot-toast strong{display:block;margin:8px 0;font-size:20px;font-weight:600}.loot-detail{font-size:11px;letter-spacing:0}@media(max-width:600px){.loot-inventory{bottom:14px;right:14px;width:215px;padding:11px 13px;font-size:11px}.loot-toast{top:30%;padding:12px 18px}.loot-toast strong{font-size:17px}}@media(prefers-reduced-motion:reduce){.loot-toast{transition:none}}

<script>/*__BUNDLE__*/</script>
<script>(()=>{'use strict';
const version='__GAME_VERSION__';let pending=false;
async function check(){
 if(pending||!/^https?:$/.test(location.protocol)||version.startsWith('__'))return;
 pending=true;
 try{const response=await fetch('/version',{cache:'no-store',signal:AbortSignal.timeout(2500)});if(!response.ok)return;const next=(await response.text()).trim();if(/^[a-f0-9]{64}$/.test(next)&&next!==version)location.reload();}catch{}finally{pending=false;}
}
setInterval(check,1000);addEventListener('focus',check);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
})();
</script></body></html>

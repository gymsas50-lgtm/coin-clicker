<script>/*__BUNDLE__*/</script>
<script>(()=>{'use strict';
const version='__GAME_VERSION__';let pending=false;
async function check(){
 if(pending||!/^https?:$/.test(location.protocol)||version.startsWith('__'))return;
 pending=true;
 try{const response=await fetch('/version',{cache:'no-store',signal:AbortSignal.timeout(2500)});if(!response.ok)return;const next=(await response.text()).trim();if(/^[a-f0-9]{64}$/.test(next)&&next!==version)location.reload();}catch{}finally{pending=false;}
}
setInterval(check,1000);addEventListener('focus',check);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
})();
